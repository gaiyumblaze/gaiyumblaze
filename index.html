<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GaiyumBlaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0d10;
    --bg-elev: #16181d;
    --bg-card: #1b1e24;
    --blaze: #ff5a1f;
    --blaze-2: #ffb000;
    --text: #f3f1ea;
    --text-dim: #9a9a9e;
    --border: rgba(255,255,255,0.08);
    --skel: rgba(255,255,255,0.06);
    --skel-shine: rgba(255,255,255,0.14);
  }
  :root[data-theme="light"]{
    --bg: #f4f4f2;
    --bg-elev: #ffffff;
    --bg-card: #f0efec;
    --text: #16181d;
    --text-dim: #6c6c72;
    --border: rgba(0,0,0,0.09);
    --skel: rgba(0,0,0,0.06);
    --skel-shine: rgba(0,0,0,0.12);
  }
  *{
    box-sizing:border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    transition:background .25s,color .25s;
  }
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,h4{font-family:'Archivo Black',sans-serif;font-weight:400;margin:0;}

  /* ---------- Nav ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 4vw;
    background:linear-gradient(to bottom, rgba(12,13,16,0.97), rgba(12,13,16,0));
    transition:background .3s;
  }
  header.scrolled{background:var(--bg);opacity:.97;backdrop-filter:blur(6px);}
  :root[data-theme="light"] header{background:linear-gradient(to bottom, rgba(244,244,242,0.97), rgba(244,244,242,0));}
  :root[data-theme="light"] header.scrolled{background:rgba(244,244,242,0.94);}
  .brand{
    font-family:'Archivo Black',sans-serif;
    font-size:21px;letter-spacing:0.3px;
    display:flex;align-items:center;gap:8px;flex:0 0 auto;cursor:pointer;
  }
  .brand-dot{width:10px;height:10px;border-radius:2px;background:var(--blaze);display:inline-block;transform:rotate(45deg);flex:0 0 auto;}
  .brand span.txt{background:linear-gradient(90deg,var(--blaze),var(--blaze-2));-webkit-background-clip:text;background-clip:text;color:transparent;}

  .header-actions{
    display:flex;align-items:center;gap:10px;
  }

  .theme-toggle-btn{
    background:rgba(255,255,255,0.08);border:1px solid var(--border);color:var(--text);
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:15px;flex:0 0 auto;
  }

  nav{display:flex;align-items:center;}
  nav ul{list-style:none;display:flex;gap:20px;margin:0;padding:0;align-items:center;}
  nav a{font-size:13.5px;font-weight:500;color:var(--text-dim);white-space:nowrap;position:relative;padding-bottom:4px;}
  nav a:hover{color:var(--text);}
  nav a.active{color:var(--text);}
  nav a.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;
    background:linear-gradient(90deg,var(--blaze),var(--blaze-2));border-radius:2px;
  }

  /* Floating Auth Button (Bottom Right) */
  .floating-auth-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blaze), var(--blaze-2));
    box-shadow: 0 8px 24px rgba(255, 90, 31, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.2);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .floating-auth-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 28px rgba(255, 90, 31, 0.6);
  }
  .floating-auth-btn svg {
    width: 24px;
    height: 24px;
    fill: #ffffff;
  }
  .floating-user-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }

  /* Auth Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .auth-modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    padding: 28px;
    position: relative;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    text-align: center;
  }
  .modal-close {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; color: var(--text-dim);
    font-size: 20px; cursor: pointer;
  }
  .auth-modal h3 { font-size: 20px; margin-bottom: 8px; }
  .auth-modal p { color: var(--text-dim); font-size: 13.5px; margin-bottom: 24px; }
  .social-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px; margin-bottom: 12px;
    border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text); font-weight: 600; font-size: 14px;
    cursor: pointer; transition: background 0.2s;
  }
  .social-btn:hover { background: rgba(255,255,255,0.12); }
  .social-btn.google { border-color: rgba(234, 67, 53, 0.4); }

  .user-modal-profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .user-modal-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid var(--blaze-2);
  }
  .dashboard-links{
    width:100%;display:flex;flex-direction:column;gap:8px;margin-top:6px;text-align:left;
  }
  .dashboard-links a{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:13.5px;font-weight:600;
    color:var(--text);cursor:pointer;
  }
  .dashboard-links a:hover{background:rgba(255,255,255,0.1);}
  .logout-btn-modal {
    width: 100%;
    background: rgba(255, 90, 31, 0.2);
    color: #ff5a1f;
    border: 1px solid var(--blaze);
    padding: 10px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .logout-btn-modal:hover {
    background: var(--blaze);
    color: #fff;
  }

  /* Menu Toggle Button (3 Dots) */
  .menu-toggle{
    display:none;
    background:none;
    border:none;
    color:var(--text);
    font-size:22px;
    cursor:pointer;
    padding:4px 8px;
  }

  /* Search Styles */
  .search-wrap{position:relative;flex:0 0 auto;width:min(38vw,260px);}
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:7px;
    padding:8px 12px;
  }
  .search-box input{
    background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13.5px;width:100%;
    -webkit-user-select: auto;
    -moz-user-select: auto;
    -ms-user-select: auto;
    user-select: auto;
  }
  .search-box input::placeholder{color:var(--text-dim);}

  .search-dd{
    position:absolute;top:calc(100% + 8px);right:0;left:auto;width:300px;
    background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;
    overflow:hidden;display:none;max-height:70vh;overflow-y:auto;z-index:50;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
  }
  .search-dd.open{display:block;}

  /* ---------- Category Filter Chips ---------- */
  .chips-row{
    display:flex;gap:10px;overflow-x:auto;padding:12px 4vw;margin-top:0;
    scrollbar-width:none;
    position:relative;
    z-index:4;
  }
  .chips-row::-webkit-scrollbar{display:none;}
  .chip-btn{
    flex:0 0 auto;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;
    white-space:nowrap;transition:all .15s;
  }
  .chip-btn:hover{color:var(--text);border-color:rgba(255,90,31,0.4);}
  .chip-btn.active{background:linear-gradient(90deg,var(--blaze),var(--blaze-2));color:#111;border-color:transparent;}
  main.has-chips{padding-top:0;}

  /* ---------- Skeleton / Shimmer ---------- */
  @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
  .skel{
    background:linear-gradient(90deg,var(--skel) 25%,var(--skel-shine) 37%,var(--skel) 63%);
    background-size:800px 100%;animation:shimmer 1.4s linear infinite;
  }
  .skel-wrap{padding:110px 4vw 40px;}
  .skel-hero{height:60vh;min-height:400px;border-radius:0;margin-bottom:30px;}
  .skel-row-title{width:180px;height:20px;border-radius:5px;margin-bottom:14px;}
  .skel-grid{display:flex;gap:16px;overflow:hidden;margin-bottom:34px;}
  .skel-card{flex:0 0 auto;width:min(46vw,250px);}
  .skel-thumb{aspect-ratio:16/9;border-radius:8px;margin-bottom:8px;}
  .skel-line{height:12px;border-radius:4px;margin-bottom:6px;}
  .skel-line.w70{width:70%;}
  .skel-line.w40{width:40%;}

  /* ---------- Announcement ---------- */
  .announce{
    padding:11px 4vw;text-align:center;font-size:13.5px;
    background:linear-gradient(90deg, rgba(255,90,31,0.16), rgba(255,176,0,0.1));
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .announce a{color:var(--blaze-2);font-weight:600;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    height:70vh;min-height:450px;
    display:flex;align-items:flex-end;
    padding:0 4vw 40px;
    background-size:cover;background-position:center top;
    margin-top:60px;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top, var(--bg) 4%, rgba(12,13,16,0.15) 45%, rgba(12,13,16,0.55) 100%),
               linear-gradient(to right, rgba(12,13,16,0.85) 0%, rgba(12,13,16,0.15) 55%);
    pointer-events:none;
  }
  .hero-content{position:relative;z-index:2;max-width:640px;}
  .hero-eyebrow{font-size:13px;color:var(--blaze-2);font-weight:600;margin-bottom:14px;}
  .hero-title{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(32px,6vw,60px);
    line-height:1.02;margin:0 0 16px;
  }
  .hero-desc{
    font-size:15.5px;
    line-height:1.6;
    color:var(--text-dim);
    max-width:520px;
    margin:0 0 26px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero-btns{display:flex;gap:14px;}
  .btn{
    border:none;border-radius:6px;padding:13px 26px;font-size:15px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:9px;
    font-family:'Inter',sans-serif;
  }
  .btn-play{background:var(--text);color:var(--bg);}
  .btn-play:hover{opacity:.85;}
  .btn-ghost{background:rgba(255,255,255,0.12);color:var(--text);}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}

  /* ---------- Rows ---------- */
  main{position:relative;z-index:3;padding-bottom:80px;}
  main.no-hero{padding-top:76px;}
  .row{padding:0 4vw;margin-bottom:36px;}
  .row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .row-title{font-size:18.5px;font-weight:700;margin:0;}
  .see-all-btn{font-size:13px;color:var(--blaze-2);font-weight:600;cursor:pointer;}
  .see-all-btn:hover{text-decoration:underline;}
  .row-track{
    display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;
    scrollbar-width:none;
  }
  .row-track::-webkit-scrollbar{display:none;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;}

  /* YouTube Style Video Item Wrapper */
  .video-item {
    flex: 0 0 auto;
    width: min(46vw, 250px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
  }
  .grid .video-item { width: 100%; }

  .card{
    position:relative; width:100%; aspect-ratio:16/9;
    border-radius:8px;overflow:hidden;
    background:var(--bg-elev);
    transition:transform .25s ease;
    border:1px solid var(--border);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .video-item:hover .card{transform:scale(1.03);border-color:rgba(255,90,31,0.5);}

  .play-badge{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-42%);
    width:42px;height:42px;border-radius:50%;
    background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .25s, transform .25s;font-size:14px;
  }
  .video-item:hover .play-badge{opacity:1;transform:translate(-50%,-50%);}
  .badges{position:absolute;top:8px;left:8px;display:flex;gap:6px;z-index:2;}
  .badge{
    font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:4px;letter-spacing:.2px;
    background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);
  }
  .badge.new{color:var(--blaze-2);border:1px solid rgba(255,176,0,0.5);}
  .badge.trend{color:var(--blaze);border:1px solid rgba(255,90,31,0.5);}
  .views-tag{position:absolute;bottom:8px;right:8px;font-size:10.5px;color:var(--text-dim);background:rgba(0,0,0,0.55);padding:3px 7px;border-radius:4px;z-index:2;}
  .bookmark-btn{
    position:absolute;top:8px;right:8px;z-index:3;width:26px;height:26px;border-radius:6px;
    background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;
    font-size:13px;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,0.15);
  }
  .bookmark-btn.saved{background:var(--blaze);border-color:transparent;}

  .video-item-title {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
  }
  .video-item:hover .video-item-title { color: var(--blaze-2); }

  .empty-state{padding:110px 4vw;text-align:center;color:var(--text-dim);}
  .empty-state h2{font-family:'Archivo Black',sans-serif;color:var(--text);font-size:24px;margin-bottom:10px;}

  /* ---------- Category grid page ---------- */
  .page-wrap{padding:110px 4vw 70px;max-width:1200px;margin:0 auto;}
  .page-title{font-size:clamp(24px,4vw,36px);margin-bottom:8px;}
  .page-sub{color:var(--text-dim);font-size:14px;margin-bottom:28px;}
  .page-head-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px;}
  .cat-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
  .cat-card{
    border-radius:10px;padding:22px 18px;border:1px solid var(--border);cursor:pointer;
    display:flex;flex-direction:column;gap:8px;transition:transform .2s;
  }
  .cat-card:hover{transform:translateY(-3px);}
  .cat-card .icon{font-size:26px;}
  .cat-card .name{font-size:15.5px;font-weight:700;}
  .cat-card .desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;}

  .sort-select{
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    padding:9px 14px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;
  }
  .clear-history-btn{
    background:rgba(255,90,31,0.15);border:1px solid var(--blaze);color:var(--blaze-2);
    padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;
  }

  /* ---------- Watch page : sidebar layout ---------- */
  .watch-wrap{padding:100px 4vw 70px;max-width:1400px;margin:0 auto;}
  .watch-grid{display:grid;grid-template-columns:1fr;gap:32px;align-items:start;}
  @media(min-width:1000px){
    .watch-grid{grid-template-columns:minmax(0,1fr) 380px;}
    .watch-side{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow-y:auto;}
  }
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13.5px;margin-bottom:18px;cursor:pointer;}
  .back-link:hover{color:var(--text);}

  .player-frame-container{
    position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;
  }
  .player-frame{width:100%;height:100%;}
  .player-frame iframe{width:100%;height:100%;border:0;}
  #playerPlaceholder{width:100%;aspect-ratio:16/9;}

  .player-fullscreen-icon {
    position: absolute;
    bottom: 12px;
    right: 12px;
    z-index: 10;
    background: rgba(0,0,0,0.65);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s, transform 0.1s;
  }
  .player-fullscreen-icon:hover {
    background: rgba(255,90,31,0.85);
    border-color: transparent;
    transform: scale(1.08);
  }

  /* Draggable Mini / Theater floating player */
  .player-frame-container.mini-mode{
    position:fixed;
    bottom:20px;
    right:20px;
    width:min(320px,86vw);
    aspect-ratio:16/9;
    z-index:9999;
    box-shadow:0 14px 36px rgba(0,0,0,0.7);
    border:1.5px solid var(--blaze);
    border-radius:8px;
    cursor:grab;
    touch-action: none;
  }
  .player-frame-container.mini-mode:active { cursor:grabbing; }
  .mini-drag-handle {
    position:absolute;top:0;left:0;right:0;height:24px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    z-index:12;display:none;align-items:center;justify-content:center;
    color:#fff;font-size:10px;letter-spacing:1px;font-weight:600;
  }
  .player-frame-container.mini-mode .mini-drag-handle { display:flex; }
  .mini-close-btn{
    position:absolute;top:4px;right:6px;z-index:15;width:22px;height:22px;border-radius:50%;
    background:rgba(0,0,0,0.8);color:#fff;border:none;font-size:12px;cursor:pointer;display:none;
    align-items:center;justify-content:center;
  }
  .player-frame-container.mini-mode .mini-close-btn{display:flex;}
  .player-frame-container.mini-mode .player-fullscreen-icon{display:none;}

  .watch-meta{padding:20px 2px 0;}
  .watch-meta h1{font-size:clamp(20px,3vw,28px);margin-bottom:10px;cursor:pointer;}
  .watch-meta h1:hover{color:var(--blaze-2);}
  .watch-sub{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--text-dim);font-size:13px;margin-bottom:16px;}
  .watch-sub .chip{background:var(--bg-elev);border:1px solid var(--border);padding:4px 10px;border-radius:20px;}
  .watch-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;position:relative;}
  .icon-btn{background:var(--bg-elev);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 16px;font-size:13.5px;display:flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit;transition:all 0.2s;}
  .icon-btn:hover{border-color:var(--blaze);}
  .icon-btn.liked{background:rgba(255,90,31,0.2);border-color:var(--blaze);color:var(--blaze-2);}
  .icon-btn.saved{background:rgba(255,176,0,0.18);border-color:var(--blaze-2);color:var(--blaze-2);}

  .share-dd{
    position:absolute;top:calc(100% + 6px);background:var(--bg-elev);border:1px solid var(--border);
    border-radius:8px;padding:8px;display:none;flex-direction:column;gap:4px;min-width:190px;z-index:20;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
  }
  .share-dd.open{display:flex;}
  .share-dd button{
    background:none;border:none;color:var(--text);text-align:left;padding:9px 10px;border-radius:6px;
    font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;

/* ---------- Prevent Copy & Inspection Security ---------- */

/* =========================================================
   THEME TOGGLE
   ========================================================= */
const themeToggleBtn = document.getElementById('themeToggleBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeToggleBtn.textContent = t === 'light' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
applyTheme(localStorage.getItem('theme') || 'dark');
themeToggleBtn.onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(cur);
};

/* =========================================================
   LOCAL LIBRARY HELPERS
   ========================================================= */
const WL_KEY = 'gb_watchlater';
const HIST_KEY = 'gb_history';

function getWatchLater(){
  try{ return JSON.parse(localStorage.getItem(WL_KEY) || '[]'); }catch(e){ return []; }
}
function isInWatchLater(id){ return getWatchLater().includes(id); }
function toggleWatchLater(id){
  let list = getWatchLater();
  if(list.includes(id)) list = list.filter(x=>x!==id);
  else list.unshift(id);
  localStorage.setItem(WL_KEY, JSON.stringify(list));
  return list.includes(id);
}
function getHistory(){
  try{ return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }catch(e){ return []; }
}
function pushHistory(id){
  let list = getHistory().filter(h=>h.id!==id);
  list.unshift({id, ts: Date.now()});
  if(list.length > 100) list = list.slice(0,100);
  localStorage.setItem(HIST_KEY, JSON.stringify(list));
}
function clearHistory(){ localStorage.removeItem(HIST_KEY); }
function getLikedIds(){
  return allVideos.filter(v=> localStorage.getItem('liked_'+v.id) === 'true').map(v=>v.id);
}

/* ---------- Google Auth System Logic ---------- */
const authModal = document.getElementById('authModal');
const floatingAuthBtn = document.getElementById('floatingAuthBtn');
const closeAuthBtn = document.getElementById('closeAuthBtn');
const authModalBody = document.getElementById('authModalBody');

floatingAuthBtn.onclick = () => authModal.classList.add('active');
closeAuthBtn.onclick = () => authModal.classList.remove('active');
authModal.onclick = (e) => { if(e.target === authModal) authModal.classList.remove('active'); };

function openSignInModal(){
  authModal.classList.add('active');
}

function bindGoogleAuthBtn(btn){
  btn.onclick = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(() => authModal.classList.remove('active'))
      .catch(err => {
        if(err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') {
          auth.signInWithRedirect(provider);
        } else {
          alert("Google Sign-In Error: " + err.message);
        }
      });
  };
}
bindGoogleAuthBtn(document.getElementById('googleAuthBtn'));

let currentUser = null;

        <button class="logout-btn-modal" id="logoutBtnModal">Log Out</button>
      </div>
    `;
    document.getElementById('dashLiked').onclick = ()=>{ authModal.classList.remove('active'); location.hash='#/liked'; };
    document.getElementById('dashWL').onclick = ()=>{ authModal.classList.remove('active'); location.hash='#/watchlater'; };
    document.getElementById('dashHist').onclick = ()=>{ authModal.classList.remove('active'); location.hash='#/history'; };
    document.getElementById('logoutBtnModal').onclick = () => {
      auth.signOut().then(() => authModal.classList.remove('active'));
    };
  } else {
    floatingAuthBtn.innerHTML = `
      <svg id="floatingUserIcon" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    `;
    authModalBody.innerHTML = `

      <p>Sign in with Google to comment, like, and watch videos.</p>
      <button class="social-btn google" id="googleAuthBtnModal">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    `;

  }
});

/* ---------- Mobile Menu & Search ---------- */
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');
const searchBox = document.getElementById('searchBox');
const searchBtnIcon = document.getElementById('searchBtnIcon');
const searchInput = document.getElementById('searchInput');

menuToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  navMenu.classList.toggle('active');
  searchBox.classList.remove('active');
});

searchBtnIcon.addEventListener('click', (e) => {
  if (window.innerWidth <= 760) {
    e.stopPropagation();
    searchBox.classList.toggle('active');
    navMenu.classList.remove('active');
    if (searchBox.classList.contains('active')) searchInput.focus();
  }
});

let allVideos = [];
let allCategories = [];
let siteSettings = {};
let dataReady = false;

const DEFAULT_SECTIONS = [
  {id:'trending', type:'trending', title:'🔥 Trending Now', enabled:true},
  {id:'featured', type:'featured', title:'⭐ Featured', enabled:true},
  {id:'new', type:'new', title:'🆕 Recently Added', enabled:true},
  {id:'all', type:'all', title:'📺 All Videos', enabled:true}
];

function extractYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function thumbOf(v){
  const ytId = extractYouTubeId(v.youtubeLink);
  return v.thumbnail && v.thumbnail.trim() ? v.thumbnail : (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');
}
function isNew(v){
  if(!v.createdAt || !v.createdAt.toDate) return false;
  const days = (Date.now() - v.createdAt.toDate().getTime()) / 86400000;
  return days <= 7;
}

function cardHtml(v){
  const thumb = thumbOf(v);
  let badges = '';
  if(isNew(v)) badges += '<span class="badge new">NEW</span>';
  if(v.trending) badges += '<span class="badge trend">🔥 TRENDING</span>';
  const saved = isInWatchLater(v.id);
  return `
    <div class="video-item" data-id="${v.id}">
      <div class="card">
        <img src="${thumb}" alt="${escapeHtml(v.title)}" loading="lazy">
        ${badges ? `<div class="badges">${badges}</div>` : ''}
        <div class="bookmark-btn ${saved?'saved':''}" data-wl="${v.id}" title="Watch Later">${saved?'✓':'🔖'}</div>
        <div class="views-tag">${(v.views||0)} views</div>
        <div class="play-badge">▶</div>
      </div>
      <h4 class="video-item-title">${escapeHtml(v.title||'Untitled')}</h4>
    </div>
  `;
}
function bindCards(container){
  container.querySelectorAll('.video-item[data-id]').forEach(el=>{
    el.onclick = (e)=> {
      if(e.target.closest('[data-wl]')) return;
      // সাইন-ইন না থাকলে চেক
      if(!currentUser){
        openSignInModal();
        return;
      }
      location.hash = '#/watch/' + el.dataset.id;
    };
  });
  container.querySelectorAll('[data-wl]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const nowSaved = toggleWatchLater(el.dataset.wl);
      el.classList.toggle('saved', nowSaved);
      el.textContent = nowSaved ? '✓' : '🔖';
    };
  });
}

function updateActiveNav(hash){
  let route = 'home';
  if(hash.startsWith('#/categories') || hash.startsWith('#/category/')) route = 'categories';
  else if(hash.startsWith('#/watchlater')) route = 'watchlater';
  else if(hash.startsWith('#/history')) route = 'history';
  else if(hash.startsWith('#/liked')) route = 'liked';
  else if(hash === '' || hash === '#/' || hash.startsWith('#/watch/') || hash.startsWith('#/search')) route = 'home';
  document.querySelectorAll('nav a[data-route]').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route);
  });
}

function renderSkeleton(){
  const root = document.getElementById('root');
  const cardSkel = ()=> `
    <div class="skel-card">
      <div class="skel skel-thumb"></div>
      <div class="skel skel-line w70"></div>
      <div class="skel skel-line w40"></div>
    </div>`;
  root.innerHTML = `
    <div class="skel-wrap">
      <div class="skel skel-hero" style="margin-top:60px;"></div>
      <div class="skel skel-row-title"></div>
      <div class="skel-grid">${cardSkel()}${cardSkel()}${cardSkel()}${cardSkel()}</div>
    </div>`;
}
renderSkeleton();

Promise.all([
  db.collection('settings').doc('site').get(),
  db.collection('videos').orderBy('createdAt','desc').get(),
  db.collection('categories').orderBy('order','asc').get().catch(()=>({docs:[]}))
]).then(([settingsDoc, videosSnap, catsSnap])=>{
  siteSettings = settingsDoc.exists ? settingsDoc.data() : {};
  applySiteSettings();
  allVideos = videosSnap.docs.map(d=>({id:d.id, ...d.data()}));
  allCategories = catsSnap.docs.map(d=>({id:d.id, ...d.data()}));
  dataReady = true;
  router();
}).catch(err=>{
  document.getElementById('root').innerHTML = `<div class="empty-state"><h2>Failed to load data</h2><p>${escapeHtml(err.message)}</p></div>`;

function applySiteSettings(){

window.addEventListener('hashchange', router);
function router(){
  if(!dataReady) return;
  const hash = location.hash || '#/';
  window.scrollTo(0,0);
  navMenu.classList.remove('active');
  searchBox.classList.remove('active');
  updateActiveNav(hash);
  removeMiniPlayer();

  if(hash.startsWith('#/watch/')){
    if(!currentUser){
      openSignInModal();
      location.hash = '#/';
      return;
    }
    renderWatch(decodeURIComponent(hash.slice(8)));
  }
  else if(hash.startsWith('#/category/')) renderCategoryVideos(decodeURIComponent(hash.slice(11)));
  else if(hash === '#/categories') renderCategoriesPage();
  else if(hash.startsWith('#/watchlater')) renderWatchLaterPage();
  else if(hash.startsWith('#/history')) renderHistoryPage();
  else if(hash.startsWith('#/liked')) renderLikedPage();
  else if(hash.startsWith('#/search')) renderSearchPage(new URLSearchParams(hash.split('?')[1]||'').get('q')||'');
  else renderHome();
}

function getAvailableCategories(){
  const seen = new Set();
  const categories = [];
  allCategories.forEach(c => {
    if(c.name && c.name.trim()){
      seen.add(c.name.trim());
      categories.push({ name: c.name.trim(), icon: c.icon || '🎬' });
    }
  });
  allVideos.forEach(v => {
    const cat = (v.category||'').trim();
    if(cat && !seen.has(cat)){
      seen.add(cat);
      categories.push({ name: cat, icon: '🎬' });
    }
  });
  return categories;
}

function getVideosForSection(sec){
  if(sec.type === 'trending') return [...allVideos].sort((a,b)=>(b.trending?1:0)-(a.trending?1:0) || (b.views||0)-(a.views||0)).slice(0,12).filter(v=> v.trending || v.views>0);
  if(sec.type === 'featured') return allVideos.filter(v=>v.featured).slice(0,12);
  if(sec.type === 'new') return [...allVideos].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,12);
  return allVideos;
}

let globalYouTubePlayer = null;

function makeDraggable(el, handleEl){
  let isDragging = false;
  let startX, startY, initialLeft, initialTop;

  handleEl.addEventListener('mousedown', startDrag);
  handleEl.addEventListener('touchstart', startDrag, {passive:false});

  function startDrag(e){
    isDragging = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    startX = clientX;
    startY = clientY;
    const rect = el.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.left = initialLeft + 'px';
    el.style.top = initialTop + 'px';

    document.addEventListener('mousemove', onDrag);
    document.addEventListener('touchmove', onDrag, {passive:false});
    document.addEventListener('mouseup', stopDrag);
    document.addEventListener('touchend', stopDrag);
  }

  function onDrag(e){
    if(!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const dx = clientX - startX;
    const dy = clientY - startY;
    el.style.left = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, initialLeft + dx)) + 'px';
    el.style.top = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, initialTop + dy)) + 'px';
  }

  function stopDrag(){
    isDragging = false;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('touchmove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
    document.removeEventListener('touchend', stopDrag);
  }
}

        form.classList.toggle('open');
      };
    });

    listEl.querySelectorAll('.reply-form').forEach(form=>{
      form.onsubmit = (e)=>{
        e.preventDefault();
        const idx = form.dataset.replyIdx;
        const txtArea = form.querySelector('textarea');
        const txt = txtArea.value.trim();
        if(!txt) return;
        if(!commentsData[idx].replies) commentsData[idx].replies = [];
        commentsData[idx].replies.push({
          author: currentUser ? currentUser.displayName : 'ভিজিটর',
          text: txt,
          time: 'এইমাত্র'
        });
        saveComments();
        renderCommentsList();
      };
    });
  }

  renderCommentsList();

  const commentForm = document.getElementById('commentForm');
  commentForm.onsubmit = (e)=>{
    e.preventDefault();
    if(!currentUser){
      openSignInModal();
      return;
    }
    const authorEl = document.getElementById('commentAuthor');
    const textEl = document.getElementById('commentText');
    const author = authorEl.value.trim() || currentUser.displayName || 'User';
    const text = textEl.value.trim();
    if(!text) return;
    commentsData.unshift({
      author,
      text,
      time: 'এইমাত্র',
      votes: 0,
      voted: false,
      replies: []
    });
    saveComments();
    renderCommentsList();
    textEl.value = '';
  };
}
</script>
</body>
</html>
