<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaiyumBlaze - Stream Unlimited Movies & Shows</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #e50914;
      --bg-color: #0b0b0e;
      --card-bg: #16161c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-color); color: #fff; overflow-x: hidden; }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 50px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      transition: background 0.4s;
    }
    .brand-logo {
      font-size: 28px; font-weight: 800; color: var(--primary-color);
      text-transform: uppercase; letter-spacing: 1px; text-decoration: none;
    }

    /* Hero Banner */
    .hero {
      position: relative; height: 80vh; width: 100%;
      background-size: cover; background-position: center;
      display: flex; align-items: center; padding: 0 50px;
    }
    .hero-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: linear-gradient(90deg, rgba(11,11,14,0.95) 0%, rgba(11,11,14,0.3) 60%, transparent 100%),
                  linear-gradient(0deg, var(--bg-color) 0%, transparent 40%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 600px; }
    .hero-title { font-size: 48px; font-weight: 700; margin-bottom: 15px; line-height: 1.1; }
    .hero-desc { font-size: 15px; color: #ccc; margin-bottom: 25px; line-clamp: 3; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-play {
      background: var(--primary-color); color: white; border: none;
      padding: 12px 30px; font-size: 16px; font-weight: 600; border-radius: 4px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s;
    }
    .btn-play:hover { opacity: 0.85; transform: scale(1.05); }

    /* Video Rows */
    .content-container { padding: 0 50px; margin-top: -80px; position: relative; z-index: 10; }
    .category-section { margin-bottom: 40px; }
    .category-title { font-size: 20px; font-weight: 600; margin-bottom: 15px; color: #e5e5e5; }
    .video-row {
      display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; padding: 10px 0;
    }
    .video-row::-webkit-scrollbar { display: none; }
    .movie-card {
      min-width: 230px; height: 130px; background: var(--card-bg); border-radius: 6px;
      overflow: hidden; cursor: pointer; transition: transform 0.3s, border 0.3s; position: relative; flex-shrink: 0;
    }
    .movie-card img { width: 100%; height: 100%; object-fit: cover; }
    .movie-card:hover { transform: scale(1.08); border: 2px solid var(--primary-color); z-index: 20; }
    .card-title-overlay {
      position: absolute; bottom: 0; width: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent);
      padding: 8px; font-size: 13px; font-weight: 600; text-align: center;
    }

    /* Modal / Video Player Popup */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center;
    }
    .modal-content {
      position: relative; width: 80%; max-width: 900px; background: #000; border-radius: 8px; overflow: hidden;
    }
    .modal-content iframe { width: 100%; height: 500px; border: none; }
    .close-btn {
      position: absolute; top: 10px; right: 15px; color: white; font-size: 30px;
      cursor: pointer; z-index: 2001; font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="#" class="brand-logo" id="brandLogo">GaiyumBlaze</a>
  </nav>

  <!-- Hero Section -->
  <div class="hero" id="heroSection" style="background-image: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=1200');">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Featured Content</h1>
      <p class="hero-desc" id="heroDesc">Watch the latest exclusive releases on GaiyumBlaze now.</p>
      <button class="btn-play" id="heroPlayBtn">► Watch Now</button>
    </div>
  </div>

  <!-- Content Rows -->
  <div class="content-container" id="categoryRows">
    <!-- Dynamic Categories will load here -->
  </div>

  <!-- Video Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <iframe id="playerFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0jyJo7j3iU4CeUGsuxqZa6RCYe28s-JQ",
      authDomain: "gaiyumblaze-auth.firebaseapp.com",
      projectId: "gaiyumblaze-auth",
      storageBucket: "gaiyumblaze-auth.firebasestorage.app",
      messagingSenderId: "723612584485",
      appId: "1:723612584485:web:4ce26adcbfa9fdc66bcdcc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Apply Dynamic Theme
    async function applyTheme() {
      const docRef = doc(db, "settings", "theme");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists() && docSnap.data().primaryColor) {
        document.documentElement.style.setProperty('--primary-color', docSnap.data().primaryColor);
      }
    }
    applyTheme();

    // Fetch and Render Videos
    async function loadData() {
      const querySnapshot = await getDocs(collection(db, "videos"));
      const videos = [];
      querySnapshot.forEach((docSnap) => {
        videos.push({ id: docSnap.id, ...docSnap.data() });
      });

      if(videos.length === 0) return;

      // Banner Selection
      const bannerVideo = videos.find(v => v.isBanner) || videos[0];
      if (bannerVideo) {
        document.getElementById('heroSection').style.backgroundImage = `url('${bannerVideo.thumbnail}')`;
        document.getElementById('heroTitle').innerText = bannerVideo.title;
        document.getElementById('heroDesc').innerText = bannerVideo.description || '';
        document.getElementById('heroPlayBtn').onclick = () => openModal(bannerVideo.youtubeId);
      }

      // Group Videos by Category
      const categories = {};
      videos.forEach(v => {
        const cat = v.category || "General";
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(v);
      });

      // Render Categories
      const container = document.getElementById('categoryRows');
      container.innerHTML = '';

      for (const [categoryName, items] of Object.entries(categories)) {
        const section = document.createElement('div');
        section.className = 'category-section';

        let cardsHtml = '';
        items.forEach(item => {
          cardsHtml += `
            <div class="movie-card" onclick="openModal('${item.youtubeId}')">
              <img src="${item.thumbnail}" alt="${item.title}">
              <div class="card-title-overlay">${item.title}</div>
            </div>
          `;
        });

        section.innerHTML = `
          <div class="category-title">${categoryName}</div>
          <div class="video-row">${cardsHtml}</div>
        `;
        container.appendChild(section);
      }
    }

    window.openModal = function(youtubeId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('playerFrame');
      iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
      modal.style.display = 'flex';
    };

    window.closeModal = function() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('playerFrame');
      iframe.src = '';
      modal.style.display = 'none';
    };

    loadData();
  </script>
</body>
</html>
