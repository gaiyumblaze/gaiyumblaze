<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GaiyumBlaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0d10;
    --bg-elev: #16181d;
    --blaze: #ff5a1f;
    --blaze-2: #ffb000;
    --text: #f3f1ea;
    --text-dim: #9a9a9e;
    --border: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}

  /* ---------- Nav ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 4vw;
    background:linear-gradient(to bottom, rgba(12,13,16,0.95), rgba(12,13,16,0));
    transition:background .3s;
  }
  header.scrolled{background:rgba(10,11,13,0.92);backdrop-filter:blur(6px);}
  .brand{
    font-family:'Archivo Black',sans-serif;
    font-size:22px;letter-spacing:0.5px;
    display:flex;align-items:center;gap:8px;
  }
  .brand-dot{width:10px;height:10px;border-radius:2px;background:var(--blaze);display:inline-block;transform:rotate(45deg);}
  .brand span{background:linear-gradient(90deg,var(--blaze),var(--blaze-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  nav ul{list-style:none;display:flex;gap:28px;margin:0;padding:0;}
  nav a{font-size:14px;font-weight:500;color:var(--text-dim);}
  nav a:hover{color:var(--text);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    height:88vh;min-height:520px;
    display:flex;align-items:flex-end;
    padding:0 4vw 64px;
    background-size:cover;background-position:center top;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top, var(--bg) 4%, rgba(12,13,16,0.15) 45%, rgba(12,13,16,0.55) 100%),
               linear-gradient(to right, rgba(12,13,16,0.85) 0%, rgba(12,13,16,0.15) 55%);
    pointer-events:none;
  }
  .hero-content{position:relative;z-index:2;max-width:640px;}
  .hero-eyebrow{font-size:13px;color:var(--blaze-2);font-weight:600;margin-bottom:14px;}
  .hero-title{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(34px,6vw,64px);
    line-height:1.02;margin:0 0 18px;
  }
  .hero-desc{font-size:16px;line-height:1.6;color:var(--text-dim);max-width:520px;margin:0 0 28px;}
  .hero-btns{display:flex;gap:14px;}
  .btn{
    border:none;border-radius:6px;padding:13px 26px;font-size:15px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:9px;
    font-family:'Inter',sans-serif;
  }
  .btn-play{background:var(--text);color:#111;}
  .btn-play:hover{background:#dcdad2;}
  .btn-ghost{background:rgba(255,255,255,0.12);color:var(--text);}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}

  /* ---------- Rows ---------- */
  main{position:relative;z-index:3;margin-top:-48px;padding-bottom:80px;}
  .row{padding:0 4vw;margin-bottom:38px;}
  .row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .row-title{font-size:19px;font-weight:700;margin:0;}
  .row-track{
    display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;
    scrollbar-width:none;
  }
  .row-track::-webkit-scrollbar{display:none;}
  .card{
    position:relative;flex:0 0 auto;
    width:min(46vw,260px);aspect-ratio:16/9;
    border-radius:8px;overflow:hidden;cursor:pointer;
    background:var(--bg-elev);
    transition:transform .25s ease;
    border:1px solid var(--border);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .card:hover{transform:scale(1.045);z-index:5;border-color:rgba(255,90,31,0.5);}
  .card-overlay{
    position:absolute;inset:0;display:flex;align-items:flex-end;
    background:linear-gradient(to top, rgba(0,0,0,0.85), transparent 55%);
    opacity:0;transition:opacity .2s;padding:12px;
  }
  .card:hover .card-overlay{opacity:1;}
  .card-overlay h4{font-size:13.5px;margin:0;font-weight:600;line-height:1.3;}
  .play-badge{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .2s;
  }
  .card:hover .play-badge{opacity:1;}

  .empty-state{
    padding:120px 4vw;text-align:center;color:var(--text-dim);
  }
  .empty-state h2{font-family:'Archivo Black',sans-serif;color:var(--text);font-size:26px;margin-bottom:10px;}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.9);
    display:none;align-items:center;justify-content:center;padding:4vw;
  }
  .modal.open{display:flex;}
  .modal-inner{width:100%;max-width:960px;}
  .modal-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;}
  .modal-frame iframe{width:100%;height:100%;border:0;}
  .modal-meta{padding:18px 4px 0;}
  .modal-meta h3{font-size:20px;margin:0 0 8px;}
  .modal-meta p{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin:0;}
  .modal-close{
    position:absolute;top:-46px;right:0;background:none;border:none;color:var(--text);
    font-size:28px;cursor:pointer;line-height:1;
  }

  footer{padding:40px 4vw;color:var(--text-dim);font-size:13px;border-top:1px solid var(--border);}

  @media(max-width:640px){
    nav{display:none;}
    .hero{padding:0 5vw 44px;height:72vh;}
    .row{padding:0 5vw;}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="brand"><span class="brand-dot"></span><span id="brandName">GaiyumBlaze</span></div>
  <nav><ul id="navCategories"><li><a href="#top">হোম</a></li></ul></nav>
</header>

<section class="hero" id="heroSection">
  <div class="hero-content">
    <div class="hero-eyebrow" id="heroEyebrow">এখন দেখুন</div>
    <h1 class="hero-title" id="heroTitle">GaiyumBlaze</h1>
    <p class="hero-desc" id="heroDesc">তোমার নিজের সংগ্রহ করা ভিডিওগুলো এক জায়গায়, প্রিমিয়াম অভিজ্ঞতায়।</p>
    <div class="hero-btns">
      <button class="btn btn-play" id="heroPlayBtn">▶ চালান</button>
      <button class="btn btn-ghost" id="heroInfoBtn">বিস্তারিত</button>
    </div>
  </div>
</section>

<main id="rows"></main>

<div class="empty-state" id="emptyState" style="display:none;">
  <h2>এখনো কোনো ভিডিও যোগ হয়নি</h2>
  <p>Admin panel থেকে প্রথম ভিডিওটি যোগ করুন।</p>
</div>

<footer>© <span id="year"></span> <span id="footerBrand">GaiyumBlaze</span> — সব স্বত্ব সংরক্ষিত।</footer>

<div class="modal" id="playerModal">
  <div class="modal-inner">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-frame"><iframe id="modalIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
    <div class="modal-meta">
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyACv-REEfAnj4PW6jV3Qpx9CQ0gLZjmJB0",
  authDomain: "gaiyumblazeofficial.firebaseapp.com",
  projectId: "gaiyumblazeofficial",
  storageBucket: "gaiyumblazeofficial.firebasestorage.app",
  messagingSenderId: "814290482451",
  appId: "1:814290482451:web:6a1f404836563ebff3d6e6",
  measurementId: "G-TH3NEHSE2L"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

document.getElementById('year').textContent = new Date().getFullYear();

function extractYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

// ---------- Load site design settings ----------
db.collection('settings').doc('site').get().then(doc=>{
  const s = doc.exists ? doc.data() : {};
  const root = document.documentElement.style;
  if(s.blazeColor) root.setProperty('--blaze', s.blazeColor);
  if(s.blaze2Color) root.setProperty('--blaze-2', s.blaze2Color);
  if(s.bgColor) root.setProperty('--bg', s.bgColor);
  if(s.siteName){
    document.getElementById('brandName').textContent = s.siteName;
    document.getElementById('footerBrand').textContent = s.siteName;
    document.title = s.siteName;
  }
  if(s.heroTitle) document.getElementById('heroTitle').textContent = s.heroTitle;
  if(s.heroDesc) document.getElementById('heroDesc').textContent = s.heroDesc;
  if(s.heroEyebrow) document.getElementById('heroEyebrow').textContent = s.heroEyebrow;
  if(s.heroBackdrop){
    document.getElementById('heroSection').style.backgroundImage =
      `url('${s.heroBackdrop}')`;
  }
}).catch(()=>{});

// ---------- Load videos ----------
let featuredVideo = null;

db.collection('videos').orderBy('createdAt','desc').get().then(snap=>{
  if(snap.empty){
    document.getElementById('emptyState').style.display='block';
    return;
  }
  const byCategory = {};
  snap.forEach(doc=>{
    const v = {id:doc.id, ...doc.data()};
    const cat = v.category && v.category.trim() ? v.category.trim() : 'সব ভিডিও';
    if(!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(v);
    if(v.featured && !featuredVideo) featuredVideo = v;
  });
  if(!featuredVideo){
    const first = snap.docs[0].data();
    featuredVideo = {id:snap.docs[0].id, ...first};
  }

  // update hero with featured video (unless custom hero text/backdrop already set via settings)
  if(featuredVideo){
    const ytId = extractYouTubeId(featuredVideo.youtubeLink);
    if(!document.getElementById('heroSection').style.backgroundImage && ytId){
      document.getElementById('heroSection').style.backgroundImage =
        `url('https://img.youtube.com/vi/${ytId}/maxresdefault.jpg')`;
    }
    document.getElementById('heroPlayBtn').onclick = ()=>openModal(featuredVideo);
    document.getElementById('heroInfoBtn').onclick = ()=>openModal(featuredVideo);
  }

  const rowsEl = document.getElementById('rows');
  const nav = document.getElementById('navCategories');
  Object.keys(byCategory).forEach(cat=>{
    const li = document.createElement('li');
    li.innerHTML = `<a href="#cat-${cssSafe(cat)}">${cat}</a>`;
    nav.appendChild(li);

    const row = document.createElement('div');
    row.className='row';
    row.id = 'cat-'+cssSafe(cat);
    row.innerHTML = `<div class="row-head"><h2 class="row-title">${cat}</h2></div><div class="row-track"></div>`;
    const track = row.querySelector('.row-track');
    byCategory[cat].forEach(v=>{
      const ytId = extractYouTubeId(v.youtubeLink);
      const thumb = v.thumbnail && v.thumbnail.trim() ? v.thumbnail : (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');
      const card = document.createElement('div');
      card.className='card';
      card.innerHTML = `
        <img src="${thumb}" alt="${escapeHtml(v.title||'')}" loading="lazy">
        <div class="play-badge">▶</div>
        <div class="card-overlay"><h4>${escapeHtml(v.title||'শিরোনামহীন')}</h4></div>
      `;
      card.onclick = ()=>openModal(v);
      track.appendChild(card);
    });
    rowsEl.appendChild(row);
  });
});

function cssSafe(s){return s.replace(/[^a-zA-Z0-9]/g,'-');}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(v){
  const ytId = extractYouTubeId(v.youtubeLink);
  if(!ytId) return;
  document.getElementById('modalIframe').src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
  document.getElementById('modalTitle').textContent = v.title || '';
  document.getElementById('modalDesc').textContent = v.description || '';
  document.getElementById('playerModal').classList.add('open');
}
function closeModal(){
  document.getElementById('playerModal').classList.remove('open');
  document.getElementById('modalIframe').src = '';
}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('playerModal').addEventListener('click', e=>{
  if(e.target.id === 'playerModal') closeModal();
});

window.addEventListener('scroll', ()=>{
  document.getElementById('siteHeader').classList.toggle('scrolled', window.scrollY > 30);
});
</script>
</body>
</html>
