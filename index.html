<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GaiyumBlaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --bg-elev: #16181d;
    --bg-card: #1b1e24;
    --blaze: #ff5a1f;
    --blaze-2: #ffb000;
    --text: #f3f1ea;
    --text-dim: #9a9a9e;
    --border: rgba(255,255,255,0.08);
    --shimmer-bg: rgba(255, 255, 255, 0.05);
  }

  /* Light Theme Overrides */
  [data-theme="light"] {
    --bg: #f5f6f8;
    --bg-elev: #ffffff;
    --bg-card: #ffffff;
    --text: #121316;
    --text-dim: #65676b;
    --border: rgba(0,0,0,0.08);
    --shimmer-bg: rgba(0, 0, 0, 0.06);
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4 { font-family: 'Archivo Black', sans-serif; font-weight: 400; margin: 0; }

  /* ---------- Nav ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 4vw;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    transition: background .3s;
  }
  header.scrolled { backdrop-filter: blur(8px); }
  .brand {
    font-family: 'Archivo Black', sans-serif;
    font-size: 21px; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto; cursor: pointer;
  }
  .brand-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--blaze); display: inline-block; transform: rotate(45deg); flex: 0 0 auto; }
  .brand span.txt { background: linear-gradient(90deg, var(--blaze), var(--blaze-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  
  .header-actions { display: flex; align-items: center; gap: 12px; }

  nav { display: flex; align-items: center; }
  nav ul { list-style: none; display: flex; gap: 18px; margin: 0; padding: 0; align-items: center; }
  nav a { font-size: 13.5px; font-weight: 500; color: var(--text-dim); white-space: nowrap; transition: color 0.2s; position: relative; padding: 4px 0; }
  nav a:hover, nav a.active { color: var(--text); }
  nav a.active::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: var(--blaze); border-radius: 2px;
  }

  .theme-toggle-btn {
    background: rgba(255,255,255,0.08); border: 1px solid var(--border);
    color: var(--text); border-radius: 50%; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px; transition: background 0.2s;
  }

  /* Floating Auth Button */
  .floating-auth-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blaze), var(--blaze-2));
    box-shadow: 0 8px 24px rgba(255, 90, 31, 0.4);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 2px solid rgba(255,255,255,0.2);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .floating-auth-btn:hover { transform: scale(1.08); box-shadow: 0 10px 28px rgba(255, 90, 31, 0.6); }
  .floating-auth-btn svg { width: 24px; height: 24px; fill: #ffffff; }
  .floating-user-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  /* Auth Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px); z-index: 1000; display: none;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .auth-modal {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 12px; width: 100%; max-width: 380px; padding: 28px;
    position: relative; box-shadow: 0 16px 40px rgba(0,0,0,0.6); text-align: center;
  }
  .modal-close {
    position: absolute; top: 12px; right: 16px; background: none; border: none;
    color: var(--text-dim); font-size: 20px; cursor: pointer;
  }
  .auth-modal h3 { font-size: 20px; margin-bottom: 8px; }
  .auth-modal p { color: var(--text-dim); font-size: 13.5px; margin-bottom: 24px; }
  .social-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: var(--text); font-weight: 600; font-size: 14px;
    cursor: pointer; transition: background 0.2s;
  }
  .social-btn:hover { background: rgba(255,255,255,0.12); }

  .user-modal-profile { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .user-modal-avatar { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--blaze-2); }
  .logout-btn-modal {
    width: 100%; background: rgba(255, 90, 31, 0.2); color: #ff5a1f;
    border: 1px solid var(--blaze); padding: 10px; border-radius: 6px;
    font-weight: 600; cursor: pointer; margin-top: 10px;
  }
  .logout-btn-modal:hover { background: var(--blaze); color: #fff; }

  /* Menu Toggle Button */
  .menu-toggle {
    display: none; background: none; border: none; color: var(--text);
    font-size: 22px; cursor: pointer; padding: 4px 8px;
  }

  /* Search Styles */
  .search-wrap { position: relative; flex: 0 0 auto; width: min(38vw, 260px); }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 12px;
  }
  .search-box input {
    background: none; border: none; outline: none; color: var(--text); font-family: inherit;
    font-size: 13.5px; width: 100%; -webkit-user-select: auto; user-select: auto;
  }
  .search-box input::placeholder { color: var(--text-dim); }

  .search-dd {
    position: absolute; top: calc(100% + 8px); right: 0; left: auto; width: 300px;
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; display: none; max-height: 70vh; overflow-y: auto; z-index: 50;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .search-dd.open { display: block; }
  .search-dd-item { display: flex; gap: 10px; padding: 9px 12px; align-items: center; cursor: pointer; }
  .search-dd-item:hover { background: rgba(255,255,255,0.06); }
  .search-dd-item img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: #000; flex: 0 0 auto; }
  .search-dd-item .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-dd-item .c { font-size: 11.5px; color: var(--text-dim); }
  .search-dd-empty { padding: 16px; text-align: center; color: var(--text-dim); font-size: 13px; }
  .search-dd-more { padding: 10px 12px; text-align: center; font-size: 12.5px; color: var(--blaze-2); cursor: pointer; border-top: 1px solid var(--border); }

  /* Category Chips Bar */
  .chips-container {
    padding: 10px 4vw; display: flex; gap: 10px; overflow-x: auto;
    background: var(--bg); position: sticky; top: 61px; z-index: 90;
    border-bottom: 1px solid var(--border); scrollbar-width: none;
  }
  .chips-container::-webkit-scrollbar { display: none; }
  .chip-item {
    background: var(--bg-elev); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap; color: var(--text-dim); transition: all 0.2s;
  }
  .chip-item:hover, .chip-item.active { background: var(--blaze); color: #fff; border-color: var(--blaze); }

  /* Shimmer / Skeleton Effect */
  .shimmer {
    background: linear-gradient(90deg, var(--shimmer-bg) 25%, rgba(255,255,255,0.12) 50%, var(--shimmer-bg) 75%);
    background-size: 200% 100%;
    animation: shimmer-anim 1.5s infinite;
  }
  @keyframes shimmer-anim {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .skeleton-card { width: 100%; aspect-ratio: 16/9; border-radius: 8px; margin-bottom: 8px; }
  .skeleton-text { height: 14px; width: 80%; border-radius: 4px; margin-bottom: 6px; }
  .skeleton-sub { height: 12px; width: 50%; border-radius: 4px; }

  /* ---------- Mobile Responsive Adjustments ---------- */
  @media(max-width: 760px) {
    .menu-toggle { display: block; }
    nav ul {
      display: none; position: absolute; top: 100%; right: 4vw;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 8px; flex-direction: column; padding: 12px; gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    nav ul.active { display: flex; }
    .search-box input { display: none; }
    .search-box { padding: 6px 8px; background: none; border: none; }
    .search-box.active input {
      display: block; position: absolute; top: calc(100% + 8px); right: 0;
      width: 75vw; background: var(--bg-elev); border: 1px solid var(--border);
      padding: 10px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .search-wrap { width: auto; }
    .search-dd { width: 75vw; }
    .hero { padding: 0 5vw 44px; height: 70vh; }
    .row { padding: 0 5vw; }
  }

  /* Announcement */
  .announce {
    margin-top: 60px; padding: 11px 4vw; text-align: center; font-size: 13.5px;
    background: linear-gradient(90deg, rgba(255,90,31,0.16), rgba(255,176,0,0.1));
    border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .announce a { color: var(--blaze-2); font-weight: 600; }

  /* Hero */
  .hero {
    position: relative; height: 86vh; min-height: 500px;
    display: flex; align-items: flex-end; padding: 0 4vw 60px;
    background-size: cover; background-position: center top;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, var(--bg) 4%, rgba(12,13,16,0.15) 45%, rgba(12,13,16,0.55) 100%),
               linear-gradient(to right, rgba(12,13,16,0.85) 0%, rgba(12,13,16,0.15) 55%);
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 2; max-width: 640px; }
  .hero-eyebrow { font-size: 13px; color: var(--blaze-2); font-weight: 600; margin-bottom: 14px; }
  .hero-title { font-family: 'Archivo Black', sans-serif; font-size: clamp(32px,6vw,60px); line-height: 1.02; margin: 0 0 16px; }
  .hero-desc {
    font-size: 15.5px; line-height: 1.6; color: var(--text-dim); max-width: 520px; margin: 0 0 26px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;
  }
  .hero-btns { display: flex; gap: 14px; }
  .btn {
    border: none; border-radius: 6px; padding: 13px 26px; font-size: 15px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 9px; font-family: 'Inter', sans-serif;
  }
  .btn-play { background: var(--text); color: #111; }
  .btn-play:hover { background: #dcdad2; }
  .btn-ghost { background: rgba(255,255,255,0.12); color: var(--text); }
  .btn-ghost:hover { background: rgba(255,255,255,0.2); }

  /* Rows */
  main { position: relative; z-index: 3; padding-bottom: 80px; }
  main.no-hero { padding-top: 20px; }
  .row { padding: 0 4vw; margin-bottom: 36px; }
  .row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .row-title { font-size: 18.5px; font-weight: 700; margin: 0; }
  .see-all-btn { font-size: 13px; color: var(--blaze-2); font-weight: 600; cursor: pointer; }
  .see-all-btn:hover { text-decoration: underline; }
  .row-track { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .row-track::-webkit-scrollbar { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }

  /* Video Item Card */
  .video-item { flex: 0 0 auto; width: min(46vw, 250px); display: flex; flex-direction: column; gap: 8px; cursor: pointer; position: relative; }
  .grid .video-item { width: 100%; }

  .card {
    position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
    background: var(--bg-elev); transition: transform .25s ease; border: 1px solid var(--border);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-item:hover .card { transform: scale(1.03); border-color: rgba(255,90,31,0.5); }
  
  .play-badge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,0.5);
    border: 1.5px solid rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s; font-size: 14px; color: #fff;
  }
  .video-item:hover .play-badge { opacity: 1; }
  
  /* Bookmark Button on Card */
  .bookmark-btn {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    opacity: 0; transition: opacity 0.2s; cursor: pointer;
  }
  .video-item:hover .bookmark-btn { opacity: 1; }
  .bookmark-btn.saved { color: var(--blaze-2); opacity: 1; }

  .badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; z-index: 2; }
  .badge {
    font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 4px; letter-spacing: .2px;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(2px);
  }
  .badge.new { color: var(--blaze-2); border: 1px solid rgba(255,176,0,0.5); }
  .badge.trend { color: var(--blaze); border: 1px solid rgba(255,90,31,0.5); }
  .views-tag { position: absolute; bottom: 8px; right: 8px; font-size: 10.5px; color: var(--text-dim); background: rgba(0,0,0,0.55); padding: 3px 7px; border-radius: 4px; z-index: 2; }

  .video-item-title {
    font-size: 13.5px; font-weight: 600; line-height: 1.4; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; margin: 0;
  }
  .video-item:hover .video-item-title { color: var(--blaze-2); }

  .empty-state { padding: 90px 4vw; text-align: center; color: var(--text-dim); }
  .empty-state h2 { font-family: 'Archivo Black', sans-serif; color: var(--text); font-size: 24px; margin-bottom: 10px; }

  /* Page Layouts */
  .page-wrap { padding: 100px 4vw 70px; max-width: 1200px; margin: 0 auto; }
  .page-title { font-size: clamp(24px,4vw,36px); margin-bottom: 8px; }
  .page-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }

  /* Sort Dropdown */
  .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .sort-select {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none; cursor: pointer;
  }

  /* Two Column Responsive Watch Page Layout */
  .watch-container-layout {
    display: grid; grid-template-columns: 1fr; gap: 24px;
    padding: 90px 4vw 70px; max-width: 1380px; margin: 0 auto;
  }
  @media(min-width: 992px) {
    .watch-container-layout { grid-template-columns: 1fr 360px; }
  }

  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13.5px; margin-bottom: 14px; cursor: pointer; }
  .back-link:hover { color: var(--text); }
  
  .player-frame-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
  .player-frame { width: 100%; height: 100%; }
  .player-frame iframe { width: 100%; height: 100%; border: 0; }
  
  .player-fullscreen-icon {
    position: absolute; bottom: 12px; right: 12px; z-index: 10;
    background: rgba(0,0,0,0.65); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.2s, transform 0.1s;
  }
  .player-fullscreen-icon:hover { background: rgba(255,90,31,0.85); border-color: transparent; transform: scale(1.08); }

  .watch-meta { padding: 18px 2px 0; }
  .watch-meta h1 { font-size: clamp(20px,3vw,26px); margin-bottom: 10px; cursor: pointer; }
  .watch-sub { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }
  .watch-sub .chip { background: var(--bg-elev); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }
  
  .watch-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .icon-btn {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 9px 16px; font-size: 13.5px; display: flex; align-items: center;
    gap: 7px; cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .icon-btn:hover { border-color: var(--blaze); }
  .icon-btn.active { background: rgba(255,90,31,0.2); border-color: var(--blaze); color: var(--blaze-2); }

  .watch-desc-box { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; cursor: pointer; }
  .watch-desc {
    color: var(--text-dim); font-size: 14px; line-height: 1.6; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0;
  }
  .watch-desc.expanded { display: block; color: var(--text); }
  .desc-toggle-btn { font-size: 12px; font-weight: 700; color: var(--text); margin-top: 6px; display: inline-block; }

  /* Comments Section Style */
  .comments-section { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px; }
  .comments-header { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .comment-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; background: var(--bg-elev); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
  .comment-form input, .comment-form textarea {
    background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; color: var(--text); font-family: inherit; font-size: 13.5px; outline: none; -webkit-user-select: auto; user-select: auto;
  }
  .comment-form input:focus, .comment-form textarea:focus { border-color: var(--blaze); }
  .comment-form textarea { resize: vertical; min-height: 70px; }
  .comment-submit-btn { align-self: flex-end; background: var(--blaze); color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
  .comments-list { display: flex; flex-direction: column; gap: 14px; }
  .comment-card { display: flex; gap: 12px; background: var(--bg-elev); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
  .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--blaze), var(--blaze-2)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; color: #fff; }
  .comment-content { flex: 1; }
  .comment-user { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--text); display: flex; justify-content: space-between; }
  .comment-time { font-size: 11px; color: var(--text-dim); font-weight: normal; }
  .comment-text { font-size: 13.5px; color: var(--text-dim); line-height: 1.4; -webkit-user-select: text; user-select: text; }

  /* Related Sidebar Stack */
  .sidebar-stack { display: flex; flex-direction: column; gap: 12px; }
  .sidebar-card { display: flex; gap: 10px; cursor: pointer; }
  .sidebar-card .thumb { width: 120px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: var(--bg-elev); }
  .sidebar-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sidebar-card .info { display: flex; flex-direction: column; gap: 4px; }
  .sidebar-card .title { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sidebar-card .meta { font-size: 11px; color: var(--text-dim); }

  footer { padding: 40px 4vw; color: var(--text-dim); font-size: 13px; border-top: 1px solid var(--border); text-align: center; }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="brand" id="brandLink"><span class="brand-dot"></span><span class="txt" id="brandName">GaiyumBlaze</span></div>
  
  <div class="header-actions">
    <div class="search-wrap">
      <div class="search-box" id="searchBox">
        <span style="cursor:pointer;" id="searchBtnIcon">🔍</span>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyACv-REEfAnj4PW6jV3Qpx9CQ0gLZjmJB0",
  authDomain: "gaiyumblazeofficial.firebaseapp.com",
  projectId: "gaiyumblazeofficial",
  storageBucket: "gaiyumblazeofficial.firebasestorage.app",
  messagingSenderId: "814290482451",
  appId: "1:814290482451:web:6a1f404836563ebff3d6e6",
  measurementId: "G-TH3NEHSE2L"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

document.getElementById('year').textContent = new Date().getFullYear();
document.getElementById('brandLink').onclick = ()=> location.hash = '#/';

/* ---------- Prevent Copy Security ---------- */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('copy', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

/* ---------- Theme Switcher Logic ---------- */
const themeToggleBtn = document.getElementById('themeToggleBtn');
let currentTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);
themeToggleBtn.textContent = currentTheme === 'light' ? '☀️' : '🌙';

themeToggleBtn.onclick = () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  localStorage.setItem('theme', currentTheme);
  themeToggleBtn.textContent = currentTheme === 'light' ? '☀️' : '🌙';
};

/* ---------- Auth System ---------- */
const authModal = document.getElementById('authModal');
const floatingAuthBtn = document.getElementById('floatingAuthBtn');
const closeAuthBtn = document.getElementById('closeAuthBtn');
const googleAuthBtn = document.getElementById('googleAuthBtn');
const authModalBody = document.getElementById('authModalBody');

floatingAuthBtn.onclick = () => authModal.classList.add('active');
closeAuthBtn.onclick = () => authModal.classList.remove('active');
authModal.onclick = (e) => { if(e.target === authModal) authModal.classList.remove('active'); };

googleAuthBtn.onclick = () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(() => authModal.classList.remove('active'))
    .catch(err => {
      if(err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') auth.signInWithRedirect(provider);
      else alert("Google Sign-In Error: " + err.message);
    });
};

let currentUser = null;
auth.onAuthStateChanged(user => {
  currentUser = user;
  if(user) {
    const avatar = user.photoURL || 'https://via.placeholder.com/50';
    floatingAuthBtn.innerHTML = `<img class="floating-user-avatar" src="${avatar}" alt="${escapeHtml(user.displayName||'User')}">`;
    authModalBody.innerHTML = `
      <div class="user-modal-profile">
        <img class="user-modal-avatar" src="${avatar}" alt="Avatar">
        <h3>${escapeHtml(user.displayName || 'User')}</h3>
        <p style="margin-bottom:12px;">${escapeHtml(user.email || '')}</p>
        <button class="logout-btn-modal" id="logoutBtnModal">Log Out</button>
      </div>
    `;
    document.getElementById('logoutBtnModal').onclick = () => {
      auth.signOut().then(() => authModal.classList.remove('active'));
    };
  } else {
    floatingAuthBtn.innerHTML = `<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
  }
});

/* ---------- Mobile Menu & Search ---------- */
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');
const searchBox = document.getElementById('searchBox');
const searchBtnIcon = document.getElementById('searchBtnIcon');
const searchInput = document.getElementById('searchInput');

menuToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  navMenu.classList.toggle('active');
  searchBox.classList.remove('active');
});

searchBtnIcon.addEventListener('click', (e) => {
  if (window.innerWidth <= 760) {
    e.stopPropagation();
    searchBox.classList.toggle('active');
    navMenu.classList.remove('active');
    if (searchBox.classList.contains('active')) searchInput.focus();
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('nav')) navMenu.classList.remove('active');
  if (!e.target.closest('.search-wrap')) searchBox.classList.remove('active');
});

let allVideos = [];
let allCategories = [];
let siteSettings = {};
let activeChip = 'All';

/* LocalStorage Storage Wrappers for Watch Later & History */
function getSavedVideoIds() { return JSON.parse(localStorage.getItem('watch_later') || '[]'); }
function saveVideoId(id) {
  let saved = getSavedVideoIds();
  if(!saved.includes(id)) saved.push(id);
  localStorage.setItem('watch_later', JSON.stringify(saved));
}
function removeVideoId(id) {
  let saved = getSavedVideoIds().filter(x => x !== id);
  localStorage.setItem('watch_later', JSON.stringify(saved));
}
function getHistoryIds() { return JSON.parse(localStorage.getItem('watch_history') || '[]'); }
function addToHistory(id) {
  let hist = getHistoryIds().filter(x => x !== id);
  hist.unshift(id);
  localStorage.setItem('watch_history', JSON.stringify(hist.slice(0, 30)));
}

function extractYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function thumbOf(v){
  const ytId = extractYouTubeId(v.youtubeLink);
  return v.thumbnail && v.thumbnail.trim() ? v.thumbnail : (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');
}
function isNew(v){
  if(!v.createdAt || !v.createdAt.toDate) return false;
  return ((Date.now() - v.createdAt.toDate().getTime()) / 86400000) <= 7;
}

/* Video Card HTML */
function cardHtml(v){
  const thumb = thumbOf(v);
  let badges = '';
  if(isNew(v)) badges += '<span class="badge new">NEW</span>';
  if(v.trending) badges += '<span class="badge trend">🔥 TRENDING</span>';
  
  const savedIds = getSavedVideoIds();
  const isSaved = savedIds.includes(v.id);

  return `
    <div class="video-item" data-id="${v.id}">
      <div class="card">
        <img src="${thumb}" alt="${escapeHtml(v.title)}" loading="lazy">
        ${badges ? `<div class="badges">${badges}</div>` : ''}
        <button class="bookmark-btn ${isSaved ? 'saved' : ''}" data-bookmark="${v.id}" title="Watch Later">📌</button>
        <div class="views-tag">${(v.views||0)} views</div>
        <div class="play-badge">▶</div>
      </div>
      <h4 class="video-item-title">${escapeHtml(v.title||'Untitled')}</h4>
    </div>
  `;
}

function bindCards(container){
  container.querySelectorAll('.video-item[data-id]').forEach(el=>{
    el.onclick = (e)=> {
      if(e.target.closest('.bookmark-btn')) return;
      location.hash = '#/watch/' + el.dataset.id;
    };
  });

  container.querySelectorAll('.bookmark-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.bookmark;
      const isSaved = btn.classList.contains('saved');
      if(isSaved) {
        removeVideoId(id);
        btn.classList.remove('saved');
      } else {
        saveVideoId(id);
        btn.classList.add('saved');
      }
    };
  });
}

/* Skeleton Loading Render */
function renderSkeletons() {
  document.getElementById('root').innerHTML = `
    <div class="page-wrap" style="padding-top: 80px;">
      <div class="grid">
        ${Array(8).fill(`
          <div>
            <div class="skeleton-card shimmer"></div>
            <div class="skeleton-text shimmer"></div>
            <div class="skeleton-sub shimmer"></div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

renderSkeletons();

/* Load Data */
Promise.all([
  db.collection('settings').doc('site').get(),
  db.collection('videos').orderBy('createdAt','desc').get(),
  db.collection('categories').orderBy('order','asc').get().catch(()=>({docs:[]}))
]).then(([settingsDoc, videosSnap, catsSnap])=>{
  siteSettings = settingsDoc.exists ? settingsDoc.data() : {};
  applySiteSettings();

  allVideos = videosSnap.docs.map(d=>({id:d.id, ...d.data()}));
  allCategories = catsSnap.docs.map(d=>({id:d.id, ...d.data()}));

  router();
}).catch(err=>{
  document.getElementById('root').innerHTML = `<div class="empty-state"><h2>Failed to load data</h2><p>${escapeHtml(err.message)}</p></div>`;
});

function applySiteSettings(){
  const s = siteSettings;
  const root = document.documentElement.style;
  if(s.blazeColor) root.setProperty('--blaze', s.blazeColor);
  if(s.blaze2Color) root.setProperty('--blaze-2', s.blaze2Color);
  if(s.bgColor) root.setProperty('--bg', s.bgColor);
  if(s.siteName){
    document.getElementById('brandName').textContent = s.siteName;
    document.getElementById('footerBrand').textContent = s.siteName;
    document.title = s.siteName;
  }
}

/* Navigation Indicator Sync */
function updateActiveNav(hash) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  if(hash === '#/' || hash === '') document.getElementById('navHome')?.classList.add('active');
  else if(hash.startsWith('#/categories') || hash.startsWith('#/category')) document.getElementById('navCategories')?.classList.add('active');
  else if(hash === '#/saved') document.getElementById('navSaved')?.classList.add('active');
  else if(hash === '#/history') document.getElementById('navHistory')?.classList.add('active');
}

/* Category Chips Bar Render */
function renderChipsBar() {
  const chipsBar = document.getElementById('chipsBar');
  if(!chipsBar) return;
  const cats = ['All', ...new Set(allVideos.map(v => (v.category||'').trim()).filter(Boolean))];
  
  chipsBar.style.display = 'flex';
  chipsBar.innerHTML = cats.map(c => `
    <div class="chip-item ${activeChip === c ? 'active' : ''}" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</div>
  `).join('');

  chipsBar.querySelectorAll('.chip-item').forEach(chip => {
    chip.onclick = () => {
      activeChip = chip.dataset.chip;
      renderChipsBar();
      if(location.hash === '#/' || location.hash === '') renderHome();
    };
  });
}

/* Router */
window.addEventListener('hashchange', router);
function router(){
  const hash = location.hash || '#/';
  window.scrollTo(0,0);
  closeSearchDD();
  navMenu.classList.remove('active');
  searchBox.classList.remove('active');
  updateActiveNav(hash);

  if(hash.startsWith('#/watch/')) {
    document.getElementById('chipsBar').style.display = 'none';
    renderWatch(decodeURIComponent(hash.slice(8)));
  } else if(hash.startsWith('#/category/')) {
    document.getElementById('chipsBar').style.display = 'none';
    renderCategoryVideos(decodeURIComponent(hash.slice(11)));
  } else if(hash === '#/categories') {
    document.getElementById('chipsBar').style.display = 'none';
    renderCategoriesPage();
  } else if(hash === '#/saved') {
    document.getElementById('chipsBar').style.display = 'none';
    renderSavedPage();
  } else if(hash === '#/history') {
    document.getElementById('chipsBar').style.display = 'none';
    renderHistoryPage();
  } else if(hash.startsWith('#/search')) {
    document.getElementById('chipsBar').style.display = 'none';
    renderSearchPage(new URLSearchParams(hash.split('?')[1]||'').get('q')||'');
  } else {
    renderChipsBar();
    renderHome();
  }
}

/* ---------- Home Page ---------- */
function renderHome(){
  const root = document.getElementById('root');
  let filteredList = activeChip === 'All' ? allVideos : allVideos.filter(v => (v.category||'').trim() === activeChip);

  const featured = filteredList.find(v=>v.featured) || filteredList[0];

  let heroHtml = '';
  if(featured && activeChip === 'All'){
    const ytId = extractYouTubeId(featured.youtubeLink);
    const backdrop = siteSettings.heroBackdrop && siteSettings.heroBackdrop.trim()
      ? siteSettings.heroBackdrop
      : (ytId ? `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg` : '');
    heroHtml = `
      <section class="hero" style="background-image:url('${backdrop}')">
        <div class="hero-content">
          <div class="hero-eyebrow">${escapeHtml(siteSettings.heroEyebrow || 'Watch Now')}</div>
          <h1 class="hero-title">${escapeHtml(siteSettings.heroTitle || featured.title || 'GaiyumBlaze')}</h1>
          <p class="hero-desc">${escapeHtml(siteSettings.heroDesc || featured.description || '')}</p>
          <div class="hero-btns">
            <button class="btn btn-play" id="heroPlayBtn">▶ Play</button>
            <button class="btn btn-ghost" id="heroInfoBtn">More Info</button>
          </div>
        </div>
      </section>`;
  }

  if(activeChip !== 'All') {
    root.innerHTML = `
      <div class="page-wrap" style="padding-top:20px;">
        <h2 class="page-title">${escapeHtml(activeChip)}</h2>
        <div class="grid">${filteredList.map(cardHtml).join('')}</div>
      </div>
    `;
    bindCards(root);
    return;
  }

  let rowsHtml = `
    <div class="row">
      <div class="row-head"><h2 class="row-title">📺 All Videos</h2></div>
      <div class="grid">${filteredList.map(cardHtml).join('')}</div>
    </div>
  `;

  root.innerHTML = heroHtml + `<main class="${featured?'':'no-hero'}">${rowsHtml}</main>`;

  if(featured && activeChip === 'All'){
    document.getElementById('heroPlayBtn').onclick = ()=> location.hash = '#/watch/'+featured.id;
    document.getElementById('heroInfoBtn').onclick = ()=> location.hash = '#/watch/'+featured.id;
  }
  bindCards(root);
}

/* ---------- Watch Later / Saved Page ---------- */
function renderSavedPage() {
  const root = document.getElementById('root');
  const savedIds = getSavedVideoIds();
  const vids = allVideos.filter(v => savedIds.includes(v.id));

  root.innerHTML = `
    <div class="page-wrap">
      <h1 class="page-title">📌 Watch Later</h1>
      <p class="page-sub">${vids.length} Saved Videos</p>
      ${vids.length ? `<div class="grid">${vids.map(cardHtml).join('')}</div>` : `<div class="empty-state"><h2>No saved videos</h2><p>Click the bookmark icon on any video to save it for later.</p></div>`}
    </div>`;
  bindCards(root);
}

/* ---------- History Page ---------- */
function renderHistoryPage() {
  const root = document.getElementById('root');
  const histIds = getHistoryIds();
  const vids = histIds.map(id => allVideos.find(v => v.id === id)).filter(Boolean);

  root.innerHTML = `
    <div class="page-wrap">
      <h1 class="page-title">🕒 Watch History</h1>
      <p class="page-sub">${vids.length} Recently Viewed Videos</p>
      ${vids.length ? `<div class="grid">${vids.map(cardHtml).join('')}</div>` : `<div class="empty-state"><h2>No history yet</h2><p>Videos you watch will appear here.</p></div>`}
    </div>`;
  bindCards(root);
}

/* ---------- Categories Page ---------- */
function renderCategoriesPage(){
  const root = document.getElementById('root');
  const cats = [...new Set(allVideos.map(v => (v.category||'').trim()).filter(Boolean))];

  root.innerHTML = `
    <div class="page-wrap">
      <h1 class="page-title">Categories</h1>
      <div class="grid" style="margin-top:20px;">
        ${cats.map(c => `
          <div class="card" style="padding:20px; display:flex; align-items:center; justify-content:center; cursor:pointer;" data-cat="${escapeHtml(c)}">
            <h3>${escapeHtml(c)}</h3>
          </div>
        `).join('')}
      </div>
    </div>`;
  root.querySelectorAll('[data-cat]').forEach(el => {
    el.onclick = () => location.hash = '#/category/' + encodeURIComponent(el.dataset.cat);
  });
}

function renderCategoryVideos(catName){
  const root = document.getElementById('root');
  let vids = allVideos.filter(v=>(v.category||'').trim() === catName.trim());

  root.innerHTML = `
    <div class="page-wrap">
      <div class="back-link" id="backBtn">← Back</div>
      <div class="filter-bar">
        <h1 class="page-title">${escapeHtml(catName)}</h1>
        <select class="sort-select" id="sortSelect">
          <option value="latest">Latest</option>
          <option value="views">Most Viewed</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>
      <div class="grid" id="catGrid">${vids.map(cardHtml).join('')}</div>
    </div>`;

  document.getElementById('backBtn').onclick = ()=> location.hash = '#/';
  
  const sortSelect = document.getElementById('sortSelect');
  sortSelect.onchange = () => {
    let sorted = [...vids];
    if(sortSelect.value === 'views') sorted.sort((a,b) => (b.views||0) - (a.views||0));
    else if(sortSelect.value === 'oldest') sorted.reverse();
    document.getElementById('catGrid').innerHTML = sorted.map(cardHtml).join('');
    bindCards(document.getElementById('catGrid'));
  };

  bindCards(root);
}

/* ---------- Search Page ---------- */
function matchesQuery(v, q){
  const hay = [v.title, v.category, v.description, v.tags].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function renderSearchPage(q){
  const root = document.getElementById('root');
  const results = q ? allVideos.filter(v=>matchesQuery(v,q)) : [];
  root.innerHTML = `
    <div class="page-wrap">
      <div class="back-link" id="backBtn">← Back</div>
      <h1 class="page-title">Results for "${escapeHtml(q)}"</h1>
      <p class="page-sub">${results.length} Videos found</p>
      ${results.length ? `<div class="grid">${results.map(cardHtml).join('')}</div>` : `<div class="empty-state"><h2>No results found</h2></div>`}
    </div>`;
  document.getElementById('backBtn').onclick = ()=> location.hash = '#/';
  bindCards(root);
}

/* ---------- Two Column Watch Page ---------- */
function renderWatch(id){
  const v = allVideos.find(x=>x.id===id);
  const root = document.getElementById('root');
  if(!v){
    root.innerHTML = `<div class="page-wrap"><div class="empty-state"><h2>Video not found</h2></div></div>`;
    return;
  }

  // Add video to History
  addToHistory(v.id);

  const ytId = extractYouTubeId(v.youtubeLink);
  const relatedPool = allVideos.filter(x=>x.id!==v.id).slice(0,10);
  let likedState = localStorage.getItem('liked_' + v.id) === 'true';
  let savedIds = getSavedVideoIds();
  let isSaved = savedIds.includes(v.id);

  root.innerHTML = `
    <div class="watch-container-layout">
      <!-- Main Content Left Column -->
      <div>
        <div class="back-link" id="backBtn">← Go Back</div>
        
        <div class="player-frame-container" id="playerContainer">
          <div class="player-frame">
            <iframe id="videoIframe" src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&enablejsapi=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe>
          </div>
          <button class="player-fullscreen-icon" id="inPlayerFullscreenBtn" title="Fullscreen">⛶</button>
        </div>
        
        <div class="watch-meta">
          <h1 id="watchTitle">${escapeHtml(v.title)}</h1>
          <div class="watch-sub">
            ${v.category ? `<span class="chip">${escapeHtml(v.category)}</span>` : ''}
            <span class="chip">${(v.views||0)+1} views</span>
          </div>
          
          <div class="watch-actions">
            <button class="icon-btn ${likedState ? 'active' : ''}" id="likeBtn">
              👍 <span id="likeCount">${v.likes || 0}</span> Like
            </button>
            <button class="icon-btn ${isSaved ? 'active' : ''}" id="watchLaterBtn">
              📌 Watch Later
            </button>
            <button class="icon-btn" id="shareBtn">↗ Share</button>
          </div>
          
          <div class="watch-desc-box" id="descBox">
            <p class="watch-desc" id="watchDesc">${escapeHtml(v.description||'No description available.')}</p>
            <span class="desc-toggle-btn" id="descToggle">Show more</span>
          </div>
        </div>

        <!-- Comments Section -->
        <div class="comments-section">
          <div class="comments-header">💬 Comments (<span id="commentCount">0</span>)</div>
          <form class="comment-form" id="commentForm">
            <input type="text" id="commentUser" placeholder="Your Name" required>
            <textarea id="commentText" placeholder="Add a comment..." required></textarea>
            <button type="submit" class="comment-submit-btn">Comment</button>
          </form>
          <div class="comments-list" id="commentsList">
            <div style="color:var(--text-dim);font-size:13px;">Loading comments...</div>
          </div>
        </div>
      </div>

      <!-- Right Sidebar Stack Column -->
      <div class="sidebar-stack">
        <h3 style="font-size:16px;margin-bottom:8px;">Related Videos</h3>
        ${relatedPool.map(rel => `
          <div class="sidebar-card" data-id="${rel.id}">
            <div class="thumb"><img src="${thumbOf(rel)}" alt=""></div>
            <div class="info">
              <div class="title">${escapeHtml(rel.title)}</div>
              <div class="meta">${escapeHtml(rel.category\vert{}\vert{}'')} •${(rel.views||0)} views</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;

  document.getElementById('backBtn').onclick = ()=> history.length > 1 ? history.back() : (location.hash = '#/');
  
  /* Sidebar Card Clicks */
  root.querySelectorAll('.sidebar-card').forEach(card => {
    card.onclick = () => location.hash = '#/watch/' + card.dataset.id;
  });

  /* In-Player Fullscreen */
  const playerContainer = document.getElementById('playerContainer');
  document.getElementById('inPlayerFullscreenBtn').onclick = () => {
    if (!document.fullscreenElement) {
      if (playerContainer.requestFullscreen) playerContainer.requestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  };

  /* Description Expand/Collapse */
  const watchDesc = document.getElementById('watchDesc');
  const descToggle = document.getElementById('descToggle');
  document.getElementById('descBox').onclick = () => {
    watchDesc.classList.toggle('expanded');
    descToggle.textContent = watchDesc.classList.contains('expanded') ? 'Show less' : 'Show more';
  };

  if(currentUser) {
    const commentUser = document.getElementById('commentUser');
    if(commentUser) commentUser.value = currentUser.displayName || '';
  }

  /* Like Logic */
  const likeBtn = document.getElementById('likeBtn');
  const likeCountEl = document.getElementById('likeCount');
  likeBtn.onclick = () => {
    if(!likedState) {
      likedState = true;
      localStorage.setItem('liked_' + v.id, 'true');
      likeBtn.classList.add('active');
      v.likes = (v.likes || 0) + 1;
      likeCountEl.textContent = v.likes;
      db.collection('videos').doc(v.id).update({ likes: firebase.firestore.FieldValue.increment(1) });
    } else {
      likedState = false;
      localStorage.removeItem('liked_' + v.id);
      likeBtn.classList.remove('active');
      v.likes = Math.max(0, (v.likes || 1) - 1);
      likeCountEl.textContent = v.likes;
      db.collection('videos').doc(v.id).update({ likes: firebase.firestore.FieldValue.increment(-1) });
    }
  };

  /* Watch Later Toggle */
  const watchLaterBtn = document.getElementById('watchLaterBtn');
  watchLaterBtn.onclick = () => {
    if(isSaved) {
      removeVideoId(v.id);
      isSaved = false;
      watchLaterBtn.classList.remove('active');
    } else {
      saveVideoId(v.id);
      isSaved = true;
      watchLaterBtn.classList.add('active');
    }
  };

  /* Native Web Share API */
  document.getElementById('shareBtn').onclick = () => {
    const shareData = {
      title: v.title,
      text: v.description,
      url: window.location.href
    };
    if (navigator.share) {
      navigator.share(shareData).catch(() => {});
    } else {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("Link copied to clipboard!");
      });
    }
  };

  loadComments(v.id);

  /* Comment Form Submit */
  document.getElementById('commentForm').onsubmit = (e) => {
    e.preventDefault();
    const userName = document.getElementById('commentUser').value.trim();
    const userText = document.getElementById('commentText').value.trim();

    if(!userName || !userText) return;

    db.collection('videos').doc(v.id).collection('comments').add({
      userName: userName,
      text: userText,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      document.getElementById('commentText').value = '';
      loadComments(v.id);
    });
  };

  /* Increment View Count */
  db.collection('videos').doc(v.id).update({
    views: firebase.firestore.FieldValue.increment(1)
  }).then(()=>{ v.views = (v.views||0)+1; });
}

/* Load Comments Function */
function loadComments(videoId) {
  const commentsList = document.getElementById('commentsList');
  const commentCountEl = document.getElementById('commentCount');

  db.collection('videos').doc(videoId).collection('comments')
    .orderBy('createdAt', 'desc').get()
    .then(snapshot => {
      commentCountEl.textContent = snapshot.size;
      if (snapshot.empty) {
        commentsList.innerHTML = `<div style="color:var(--text-dim);font-size:13px;">No comments yet. Be the first to comment!</div>`;
        return;
      }
      
      commentsList.innerHTML = snapshot.docs.map(doc => {
        const c = doc.data();
        const initial = (c.userName || 'A').charAt(0).toUpperCase();
        let timeStr = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate().toLocaleDateString() : 'Just now';
        return `
          <div class="comment-card">
            <div class="comment-avatar">${initial}</div>
            <div class="comment-content">
              <div class="comment-user">
                <span>${escapeHtml(c.userName || 'Anonymous')}</span>
                <span class="comment-time">${timeStr}</span>
              </div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
            </div>
          </div>
        `;
      }).join('');
    });
}

/* Search Dropdown Behavior */
const searchDD = document.getElementById('searchDD');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim();
  if(!q){ closeSearchDD(); return; }
  const results = allVideos.filter(v=>matchesQuery(v,q)).slice(0,6);
  if(!results.length){
    searchDD.innerHTML = `<div class="search-dd-empty">No results found</div>`;
  } else {
    searchDD.innerHTML = results.map(v=>`
      <div class="search-dd-item" data-id="${v.id}">
        <img src="${thumbOf(v)}" alt="">
        <div><div class="t">${escapeHtml(v.title)}</div><div class="c">${escapeHtml(v.category||'')}</div></div>
      </div>
    `).join('') + `<div class="search-dd-more" id="ddMore">See all results →</div>`;
    searchDD.querySelectorAll('.search-dd-item').forEach(el=>{
      el.onclick = ()=>{ location.hash = '#/watch/'+el.dataset.id; searchInput.value=''; closeSearchDD(); searchBox.classList.remove('active'); };
    });
    document.getElementById('ddMore').onclick = ()=>{ goSearch(q); };
  }
  searchDD.classList.add('open');
});

searchInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ goSearch(searchInput.value.trim()); }
});

function goSearch(q){
  if(!q) return;
  location.hash = '#/search?q=' + encodeURIComponent(q);
  closeSearchDD();
  searchBox.classList.remove('active');
}
function closeSearchDD(){ searchDD.classList.remove('open'); }

window.addEventListener('scroll', ()=>{
  document.getElementById('siteHeader').classList.toggle('scrolled', window.scrollY > 30);
});
</script>
</body>
</html>
