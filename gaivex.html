<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAIVEX — More Than a Social Network</title>
<style>
:root{
  --bg:#0a0a16; --panel:#12122a; --panel2:#171735;
  --grad1:#8b5cf6; --grad2:#3b82f6; --grad3:#ec4899;
  --text:#eceaf7; --muted:#8b88a8; --line:#2a2a4a;
  --danger:#ef4444;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;}

/* Splash */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#1e1a45 0%,#0a0a16 70%);text-align:center;padding:24px;}
.logo-ring{width:120px;height:120px;border-radius:50%;
  background:conic-gradient(from 180deg,var(--grad1),var(--grad2),var(--grad3),var(--grad1));
  display:flex;align-items:center;justify-content:center;margin-bottom:24px;
  box-shadow:0 0 60px rgba(139,92,246,.4);}
.logo-ring span{width:104px;height:104px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;
  background:linear-gradient(135deg,var(--grad1),var(--grad2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.splash h1{font-size:28px;letter-spacing:2px;margin:0 0 6px;}
.splash p{color:var(--muted);margin:0;font-size:14px;}

/* Generic screen */
.screen{display:none;flex:1;flex-direction:column;padding:28px 22px;animation:fade .25s ease;}
.screen.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.brand-mini{display:flex;align-items:center;gap:10px;margin-bottom:34px;}
.brand-mini .dot{width:36px;height:36px;border-radius:50%;
  background:conic-gradient(from 180deg,var(--grad1),var(--grad2),var(--grad3),var(--grad1));}
.brand-mini b{font-size:18px;letter-spacing:1px;}

h2.title{font-size:24px;margin:0 0 4px;}
p.sub{color:var(--muted);font-size:14px;margin:0 0 26px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:15px;outline:none;}
.field input:focus{border-color:var(--grad2);}

.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:600;
  cursor:pointer;margin-top:6px;transition:transform .1s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-link{background:none;color:var(--grad2);font-size:14px;padding:8px;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,.4);}

.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#f87171;
  padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none;}

/* Home */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,22,.9);
  backdrop-filter:blur(8px);z-index:5;}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:1px;}
.topbar .brand .dot{width:26px;height:26px;border-radius:50%;
  background:conic-gradient(from 180deg,var(--grad1),var(--grad2),var(--grad3),var(--grad1));}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;font-size:16px;}

.feed{flex:1;overflow-y:auto;padding:16px;}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;}
.composer textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:15px;
  resize:none;outline:none;min-height:44px;font-family:inherit;}
.composer-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.composer-actions .btn{width:auto;padding:9px 20px;font-size:13px;margin:0;}

.post{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--grad1),var(--grad3));
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.post-head .who{font-size:14px;font-weight:600;}
.post-head .when{font-size:12px;color:var(--muted);}
.post-body{font-size:14.5px;line-height:1.5;color:#dcdaef;white-space:pre-wrap;word-break:break-word;}
.post-actions{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted);}
.post-actions span{cursor:pointer;user-select:none;}
.post-actions span.liked{color:var(--grad3);}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}

.bottomnav{display:flex;justify-content:space-around;align-items:center;padding:12px 0;
  border-top:1px solid var(--line);background:rgba(10,10,22,.95);backdrop-filter:blur(8px);}
.bottomnav .nitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;}
.bottomnav .nitem.active{color:var(--grad2);}
.bottomnav .nitem .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:17px;}

.loading{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);
  font-size:13px;padding:20px;}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--grad2);
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">

  <!-- 1. Splash -->
  <div class="screen active" id="screen-splash">
    <div class="splash">
      <div class="logo-ring"><span>G</span></div>
      <h1>GAIVEX</h1>
      <p>More Than a Social Network</p>
      <div class="loading" style="margin-top:30px;"><div class="spinner"></div> লোড হচ্ছে...</div>
    </div>
  </div>

  <!-- 2. Login -->
  <div class="screen" id="screen-login">
    <div class="brand-mini"><div class="dot"></div><b>GAIVEX</b></div>
    <h2 class="title">Welcome Back</h2>
    <p class="sub">Sign in to continue your journey</p>
    <div class="error-msg" id="login-error"></div>
    <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="btn-login">Sign In</button>
    <button class="btn btn-outline" id="btn-google-login" style="margin-top:10px;">Google দিয়ে চালিয়ে যান</button>
    <div class="divider">অথবা</div>
    <button class="btn btn-link" id="goto-signup">অ্যাকাউন্ট নেই? Sign Up করুন</button>
  </div>

  <!-- 3. Signup -->
  <div class="screen" id="screen-signup">
    <div class="brand-mini"><div class="dot"></div><b>GAIVEX</b></div>
    <h2 class="title">Create Account</h2>
    <p class="sub">Explore. Create. Connect.</p>
    <div class="error-msg" id="signup-error"></div>
    <div class="field"><label>নাম</label><input type="text" id="signup-name" placeholder="তোমার নাম"></div>
    <div class="field"><label>Email</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input type="password" id="signup-password" placeholder="কমপক্ষে ৬ ডিজিট"></div>
    <button class="btn btn-primary" id="btn-signup">Get Started</button>
    <div class="divider">অথবা</div>
    <button class="btn btn-link" id="goto-login">আগে থেকে অ্যাকাউন্ট আছে? Sign In</button>
  </div>

  <!-- 6. Home -->
  <div class="screen" id="screen-home" style="padding:0;">
    <div class="topbar">
      <div class="brand"><div class="dot"></div><b>GAIVEX</b></div>
      <div style="display:flex;gap:8px;">
        <div class="icon-btn" id="btn-logout" title="Logout">⎋</div>
      </div>
    </div>
    <div class="feed" id="feed">
      <div class="composer">
        <textarea id="post-text" placeholder="তোমার মনের কথা শেয়ার করো..." rows="2"></textarea>
        <div class="composer-actions"><button class="btn btn-primary" id="btn-post">Post করুন</button></div>
      </div>
      <div id="posts-list"><div class="loading"><div class="spinner"></div> পোস্ট লোড হচ্ছে...</div></div>
    </div>
    <div class="bottomnav">
      <div class="nitem active" id="nav-home"><div class="ic">⌂</div>Home</div>
      <div class="nitem"><div class="ic">◎</div>Spaces</div>
      <div class="nitem"><div class="ic">✉</div>Chat</div>
      <div class="nitem" id="nav-profile"><div class="ic">◍</div>Profile</div>
    </div>
  </div>

  <!-- Profile -->
  <div class="screen" id="screen-profile" style="padding:0;">
    <div class="topbar">
      <div class="icon-btn" id="btn-back-home">←</div>
      <b>প্রোফাইল</b>
      <div style="width:38px;"></div>
    </div>
    <div class="feed">
      <div style="text-align:center;padding:20px 0 10px;">
        <div class="avatar" id="profile-avatar" style="width:76px;height:76px;font-size:28px;margin:0 auto 14px;"></div>
        <div id="profile-name" style="font-size:19px;font-weight:700;"></div>
        <div id="profile-email" style="font-size:13px;color:var(--muted);margin-top:2px;"></div>
      </div>
      <div style="display:flex;gap:10px;margin:20px 0;">
        <div class="post" style="flex:1;text-align:center;padding:14px 8px;">
          <div style="font-size:18px;font-weight:700;" id="profile-post-count">0</div>
          <div style="font-size:12px;color:var(--muted);">Posts</div>
        </div>
      </div>
      <div class="field"><label>নাম পরিবর্তন করুন</label><input type="text" id="edit-name"></div>
      <button class="btn btn-primary" id="btn-save-name">Save Changes</button>
      <button class="btn btn-danger" id="btn-logout-2" style="margin-top:24px;">Logout</button>
    </div>
    <div class="bottomnav">
      <div class="nitem" id="nav-home-2"><div class="ic">⌂</div>Home</div>
      <div class="nitem"><div class="ic">◎</div>Spaces</div>
      <div class="nitem"><div class="ic">✉</div>Chat</div>
      <div class="nitem active"><div class="ic">◍</div>Profile</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBI4GN_MeKm3fwVUeiouO0Opib-5w3-iio",
  authDomain: "gaivexofficial.firebaseapp.com",
  projectId: "gaivexofficial",
  storageBucket: "gaivexofficial.firebasestorage.app",
  messagingSenderId: "908554622906",
  appId: "1:908554622906:web:93df8fa45f7d29afbfef83",
  measurementId: "G-2766CQ56K9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function err(id,msg){ const e=document.getElementById(id); e.textContent=msg; e.style.display=msg?'block':'none'; }

// Auth state
let unsubPosts = null;
auth.onAuthStateChanged(user=>{
  if(user){
    ensureUserDoc(user);
    show('screen-home');
    listenPosts();
  }else{
    if(unsubPosts) unsubPosts();
    show('screen-login');
  }
});

async function ensureUserDoc(user){
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if(!snap.exists){
    await ref.set({
      name: user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
      email: user.email || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
}

// Login
document.getElementById('btn-login').onclick = async ()=>{
  err('login-error','');
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  if(!email||!pass){ err('login-error','ইমেইল ও পাসওয়ার্ড দিন'); return; }
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ err('login-error', friendlyErr(e)); }
};
document.getElementById('btn-google-login').onclick = async ()=>{
  err('login-error','');
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(e){ err('login-error', friendlyErr(e)); }
};
document.getElementById('goto-signup').onclick = ()=> show('screen-signup');
document.getElementById('goto-login').onclick = ()=> show('screen-login');

// Signup
document.getElementById('btn-signup').onclick = async ()=>{
  err('signup-error','');
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pass = document.getElementById('signup-password').value;
  if(!name||!email||!pass){ err('signup-error','সব ফিল্ড পূরণ করুন'); return; }
  if(pass.length<6){ err('signup-error','পাসওয়ার্ড কমপক্ষে ৬ ডিজিট হতে হবে'); return; }
  try{
    const cred = await auth.createUserWithEmailAndPassword(email,pass);
    await cred.user.updateProfile({displayName:name});
    await ensureUserDoc({uid:cred.user.uid, displayName:name, email});
  }catch(e){ err('signup-error', friendlyErr(e)); }
};

document.getElementById('btn-logout').onclick = ()=> auth.signOut();

function friendlyErr(e){
  const map = {
    'auth/invalid-email':'ইমেইল সঠিক নয়',
    'auth/user-not-found':'অ্যাকাউন্ট পাওয়া যায়নি',
    'auth/wrong-password':'পাসওয়ার্ড ভুল',
    'auth/email-already-in-use':'এই ইমেইল দিয়ে আগে থেকে অ্যাকাউন্ট আছে',
    'auth/weak-password':'পাসওয়ার্ড দুর্বল',
    'auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড ভুল'
  };
  return map[e.code] || (e.message || 'কিছু একটা ভুল হয়েছে, আবার চেষ্টা করুন');
}

// Posts
function listenPosts(){
  const list = document.getElementById('posts-list');
  unsubPosts = db.collection('posts').orderBy('createdAt','desc').limit(50)
    .onSnapshot(snap=>{
      if(snap.empty){ list.innerHTML = '<div class="empty">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি তুমিই করো!</div>'; return; }
      let html='';
      snap.forEach(doc=>{
        const p = doc.data();
        const initials = (p.authorName||'U').trim().charAt(0).toUpperCase();
        const when = p.createdAt && p.createdAt.toDate ? timeAgo(p.createdAt.toDate()) : 'এখনই';
        const likedByMe = (p.likes||[]).includes(auth.currentUser.uid);
        html += `<div class="post">
          <div class="post-head">
            <div class="avatar">${initials}</div>
            <div><div class="who">${escapeHtml(p.authorName||'User')}</div><div class="when">${when}</div></div>
          </div>
          <div class="post-body">${escapeHtml(p.text||'')}</div>
          <div class="post-actions">
            <span class="${likedByMe?'liked':''}" onclick="toggleLike('${doc.id}',${likedByMe})">❤ ${(p.likes||[]).length}</span>
            <span>💬 ${p.commentCount||0}</span>
          </div>
        </div>`;
      });
      list.innerHTML = html;
    }, e=>{ list.innerHTML = '<div class="empty">পোস্ট লোড করতে সমস্যা হয়েছে</div>'; console.error(e); });
}

document.getElementById('btn-post').onclick = async ()=>{
  const ta = document.getElementById('post-text');
  const text = ta.value.trim();
  if(!text) return;
  const btn = document.getElementById('btn-post');
  btn.disabled = true; btn.textContent='...';
  try{
    await db.collection('posts').add({
      text,
      authorId: auth.currentUser.uid,
      authorName: auth.currentUser.displayName || 'User',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      likes: [],
      commentCount: 0
    });
    ta.value='';
  }catch(e){ alert('পোস্ট করতে সমস্যা হয়েছে: '+e.message); }
  btn.disabled=false; btn.textContent='Post করুন';
};

window.toggleLike = async (postId, liked)=>{
  const ref = db.collection('posts').doc(postId);
  const uid = auth.currentUser.uid;
  try{
    await ref.update({
      likes: liked ? firebase.firestore.FieldValue.arrayRemove(uid) : firebase.firestore.FieldValue.arrayUnion(uid)
    });
  }catch(e){ console.error(e); }
};

// Profile nav
document.getElementById('nav-profile').onclick = ()=>{ show('screen-profile'); loadProfile(); };
document.getElementById('btn-back-home').onclick = ()=> show('screen-home');
document.getElementById('nav-home-2').onclick = ()=> show('screen-home');
document.getElementById('btn-logout-2').onclick = ()=> auth.signOut();

async function loadProfile(){
  const user = auth.currentUser;
  if(!user) return;
  const name = user.displayName || (user.email?user.email.split('@')[0]:'User');
  document.getElementById('profile-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('profile-name').textContent = name;
  document.getElementById('profile-email').textContent = user.email || '';
  document.getElementById('edit-name').value = name;
  try{
    const snap = await db.collection('posts').where('authorId','==',user.uid).get();
    document.getElementById('profile-post-count').textContent = snap.size;
  }catch(e){ console.error(e); }
}

document.getElementById('btn-save-name').onclick = async ()=>{
  const newName = document.getElementById('edit-name').value.trim();
  if(!newName) return;
  const btn = document.getElementById('btn-save-name');
  btn.disabled=true; btn.textContent='Saving...';
  try{
    await auth.currentUser.updateProfile({displayName:newName});
    await db.collection('users').doc(auth.currentUser.uid).update({name:newName});
    loadProfile();
  }catch(e){ alert('সেভ করতে সমস্যা হয়েছে: '+e.message); }
  btn.disabled=false; btn.textContent='Save Changes';
};

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function timeAgo(date){
  const s = Math.floor((Date.now()-date.getTime())/1000);
  if(s<60) return 'এখনই';
  if(s<3600) return Math.floor(s/60)+'মি আগে';
  if(s<86400) return Math.floor(s/3600)+'ঘ আগে';
  return Math.floor(s/86400)+'দিন আগে';
}
</script>
</body>
</html>
