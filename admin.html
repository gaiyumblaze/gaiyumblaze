<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaiyumBlaze - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #0f0f12; color: #fff; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1, h2 { margin-bottom: 20px; color: #e50914; }
    .card { background: #18181c; padding: 25px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #282830; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; }
    input, textarea, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #09090b; color: #fff; font-size: 14px; }
    input[type="checkbox"] { width: auto; display: inline-block; }
    button { background: #e50914; color: white; border: none; padding: 12px 25px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #b80710; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .video-card { background: #222228; border-radius: 8px; overflow: hidden; position: relative; }
    .video-card img { width: 100%; height: 130px; object-fit: cover; }
    .video-card-body { padding: 12px; }
    .video-card-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delete-btn { background: #ff3333; padding: 6px 12px; font-size: 12px; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GaiyumBlaze Control Panel</h1>

    <!-- Design Control -->
    <div class="card">
      <h2>Theme & Design Settings</h2>
      <div class="form-group">
        <label>Primary Brand Accent Color</label>
        <input type="color" id="primaryColor" value="#e50914" style="height: 45px; cursor: pointer;">
      </div>
      <button onclick="saveTheme()">Save Theme</button>
    </div>

    <!-- Video Upload Form -->
    <div class="card">
      <h2>Add New Content</h2>
      <form id="uploadForm">
        <div class="form-group">
          <label>Video Title</label>
          <input type="text" id="title" placeholder="e.g. Action Scene #1" required>
        </div>
        <div class="form-group">
          <label>YouTube Video Link or ID</label>
          <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ" required>
        </div>
        <div class="form-group">
          <label>Custom Thumbnail URL (Optional - leaves blank to use YouTube thumbnail)</label>
          <input type="url" id="thumbnail" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="Trending Now">Trending Now</option>
            <option value="Action & Adventure">Action & Adventure</option>
            <option value="Popular Uploads">Popular Uploads</option>
            <option value="Exclusive">Exclusive</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="3" placeholder="Enter video description..."></textarea>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="isBanner"> Set as Featured Hero Banner
          </label>
        </div>
        <button type="submit">Publish Content</button>
      </form>
    </div>

    <!-- Video List -->
    <div class="card">
      <h2>Uploaded Videos</h2>
      <div class="video-grid" id="adminVideoGrid">
        <p>Loading videos...</p>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0jyJo7j3iU4CeUGsuxqZa6RCYe28s-JQ",
      authDomain: "gaiyumblaze-auth.firebaseapp.com",
      projectId: "gaiyumblaze-auth",
      storageBucket: "gaiyumblaze-auth.firebasestorage.app",
      messagingSenderId: "723612584485",
      appId: "1:723612584485:web:4ce26adcbfa9fdc66bcdcc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Extract YouTube ID
    function getYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    // Load Theme Settings
    async function loadSettings() {
      const docRef = doc(db, "settings", "theme");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        document.getElementById('primaryColor').value = docSnap.data().primaryColor || '#e50914';
      }
    }
    loadSettings();

    // Save Theme
    window.saveTheme = async function() {
      const color = document.getElementById('primaryColor').value;
      await setDoc(doc(db, "settings", "theme"), { primaryColor: color });
      alert("Theme saved successfully!");
    };

    // Form Submit
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawUrl = document.getElementById('youtubeUrl').value;
      const videoId = getYoutubeId(rawUrl);
      const customThumb = document.getElementById('thumbnail').value;

      const videoData = {
        title: document.getElementById('title').value,
        youtubeId: videoId,
        thumbnail: customThumb || `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value,
        isBanner: document.getElementById('isBanner').checked,
        createdAt: new Date().getTime()
      };

      await addDoc(collection(db, "videos"), videoData);
      alert("Content uploaded successfully!");
      document.getElementById('uploadForm').reset();
      loadVideos();
    });

    // Load All Videos
    async function loadVideos() {
      const querySnapshot = await getDocs(collection(db, "videos"));
      const grid = document.getElementById('adminVideoGrid');
      grid.innerHTML = '';

      querySnapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <img src="${item.thumbnail}" alt="thumb">
          <div class="video-card-body">
            <div class="video-card-title">${item.title}</div>
            <small>${item.category}</small>
            <button class="delete-btn" onclick="deleteVideo('${docSnap.id}')">Delete</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.deleteVideo = async function(id) {
      if (confirm("Are you sure you want to delete this video?")) {
        await deleteDoc(doc(db, "videos", id));
        loadVideos();
      }
    };

    loadVideos();
  </script>
</body>
</html>
